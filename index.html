<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>练习使用多用电表 · 虚拟实验台</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC","WenQuanYi Zen Hei",sans-serif;
  background:linear-gradient(135deg,#f5f7fa 0%,#e4edf9 100%);
  color:#333333;overflow:hidden;user-select:none;-webkit-tap-highlight-color:transparent;
}
svg text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC","WenQuanYi Zen Hei",sans-serif}
.app{height:100%;display:flex;flex-direction:column}

header{
  height:52px;margin:10px 12px 0;padding:0 16px;display:flex;align-items:center;gap:14px;
  background:rgba(255,255,255,.95);border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.08);flex:0 0 auto;
}
.h-left{display:flex;align-items:baseline;gap:12px}
.h-left b{font-size:18px;color:#1565c0;letter-spacing:.5px}
.h-left span{font-size:12.5px;color:#90a4ae}
.h-right{display:flex;gap:8px;margin-left:auto}
.btn{border:1px solid #dde2e9;background:#ffffff;color:#546e7a;border-radius:9px;padding:7px 14px;font-size:14px;
  font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap}
.btn:hover{background:#f1f7ff;border-color:#3498db;color:#2980b9}
.btn-thin{color:#90a4ae;font-size:13px;padding:6px 10px}

main{
  flex:1;display:grid;grid-template-columns:1fr 420px;grid-template-rows:1.42fr 1fr;
  gap:12px;padding:10px 12px 12px;min-height:0;
}
.card{background:#ffffff;border-radius:15px;box-shadow:0 8px 25px rgba(0,0,0,.08);padding:8px 12px;
  display:flex;flex-direction:column;min-height:0;overflow:hidden;position:relative}
.card-h{font-size:12.5px;font-weight:700;color:#546e7a;display:flex;align-items:center;justify-content:space-between;
  gap:6px;flex:0 0 auto;margin-bottom:3px;white-space:nowrap}
.card-h em{font-style:normal;color:#90a4ae;font-weight:400;font-size:11.5px}

.dial-card{grid-column:1;grid-row:1;padding:4px 8px}
#dialBox{flex:1;min-height:0}
.cir-card{grid-column:1;grid-row:2;padding:6px 10px}
#cirBox{flex:1;min-height:0}

.right-col{grid-column:2;grid-row:1/3;display:flex;flex-direction:column;gap:10px;min-height:0}
.read-card{flex:0 0 186px;justify-content:center;gap:2px}
.read-head{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:#90a4ae;font-weight:700}
.read-big{font-family:"Courier New",ui-monospace,monospace;font-size:78px;font-weight:700;color:#297fb8;
  line-height:1.02;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.read-big.off{color:#b0b0b0}
.read-big.over{color:#c0392b;font-size:54px}
.read-sub{font-size:13.5px;color:#546e7a;line-height:1.4}
.read-note{font-size:12.5px;color:#90a4ae;line-height:1.35;min-height:17px}
.read-note.warn{color:#c0392b;font-weight:700}
.tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px;background:#eef5fd;color:#1565c0}
.tag-off{background:#f1f7ff;color:#90a4ae}
.tag-over{background:#fdecea;color:#c0392b}
.tag-ohm{background:#fdf0ee;color:#a93226}
.tag-v{background:#eaf4fc;color:#297fb8}
.tag-mA{background:#eafaf1;color:#1e8449}

.gear-card{flex:1 1 auto;min-height:0;padding:6px 8px}
#gearBox{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.gear-legend{display:flex;align-items:center;gap:3px;font-size:11px;font-weight:700;color:#546e7a}
.gl{width:8px;height:8px;border-radius:2px;display:inline-block;margin-left:5px}
.gl-ohm{background:#a93226}.gl-v{background:#297fb8}.gl-mA{background:#27ae60}

.zero-card{flex:0 0 168px;padding:6px 10px}
#zeroBox{flex:1;min-height:0}

.bench-card{flex:0 0 232px;padding:6px 10px}
#benchBox{flex:1;min-height:0}
.scene-tabs{display:flex;gap:4px}
.scene-tab{border:1px solid #dde2e9;background:#fff;color:#546e7a;border-radius:7px;padding:3px 6px;font-size:11px;
  cursor:pointer;font-family:inherit;font-weight:600;white-space:nowrap}
.scene-tab.on{background:#3498db;border-color:#3498db;color:#fff}
.hazard{display:none;background:#fff4e5;border:1px solid #f5c99b;border-left:4px solid #e67e22;border-radius:9px;
  padding:7px 10px;font-size:12.5px;color:#8a5a00;line-height:1.45;flex:0 0 auto}
.dial-hint{display:none;font-size:11px;color:#90a4ae;text-align:center}

@media (max-width:1560px){
  main{grid-template-columns:1fr 360px}
  .read-big{font-size:58px}
  .read-card{flex:0 0 132px}
  .zero-card{flex:0 0 112px}
  .bench-card{flex:0 0 152px}
  .right-col{gap:8px}
}
@media (max-width:1120px){
  html,body{overflow:auto}
  main{grid-template-columns:1fr;grid-template-rows:auto;padding-bottom:20px}
  .dial-card{grid-row:1}
  .right-col{grid-row:2;grid-column:1;display:block}
  .right-col>.card{margin-bottom:10px}
  .cir-card{grid-row:3}
  #dialBox{height:320px}
  #gearBox{height:340px}
  #zeroBox{height:170px}
  #benchBox{height:250px}
  .read-card{height:140px}
  .zero-card{height:150px}
  .bench-card{height:230px}
  .gear-card{height:360px}
}
@media (max-width:760px){
  header{height:auto;flex-wrap:wrap;padding:8px 10px;gap:6px}
  .h-left{flex:1 1 100%}
  .h-right{flex:1 1 auto;justify-content:flex-end;gap:4px}
  .btn{padding:5px 9px;font-size:12.5px;border-radius:7px}
  .h-left b{font-size:15px}
  .h-left span{display:none}
  .dial-card{overflow-x:auto;overflow-y:hidden;height:auto}
  #dialSvg{min-width:760px}
  .dial-hint{display:block}
  .cir-card{overflow-x:auto}
  #cirSvg{min-width:700px}
  .read-big{font-size:46px}
  .read-card{flex:0 0 132px}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="h-left"><b>练习使用多用电表</b><span>实时操作 · 表盘 / 挡位 / 内部电路一一对应</span></div>
    <div class="h-right">
      <button id="btnFull" class="btn">全屏</button>
      <button id="btnTest" class="btn btn-thin">自检</button>
      <button id="btnReset" class="btn">重置</button>
    </div>
  </header>

  <main>
    <div class="card dial-card">
      <div id="dialBox"></div>
      <div class="dial-hint">← 左右滑动看完整表盘 →</div>
    </div>

    <div class="card cir-card">
      <div class="card-h">内部电路<em id="cirNow">转动旋钮，看电流走哪一条路</em></div>
      <div id="cirBox"></div>
    </div>

    <div class="right-col">
      <div class="card read-card">
        <div class="read-head"><span>读数</span><span id="readTag" class="tag tag-off">OFF</span></div>
        <div id="readBig" class="read-big off">—</div>
        <div id="readSub" class="read-sub">旋钮在 OFF：表头没有接入任何电路</div>
        <div id="readNote" class="read-note"></div>
      </div>

      <div class="card gear-card">
        <div class="card-h">选择开关
          <span class="gear-legend"><i class="gl gl-ohm"></i>Ω<i class="gl gl-v"></i>V<i class="gl gl-mA"></i>mA</span>
        </div>
        <div id="gearBox"></div>
      </div>

      <div class="card zero-card">
        <div class="card-h">两个调零旋钮<em>拖动圆盘</em></div>
        <div id="zeroBox"></div>
      </div>

      <div class="card bench-card">
        <div class="card-h">表笔与被测物
          <span class="scene-tabs">
            <button class="scene-tab" data-scene="battery">电池</button>
            <button class="scene-tab" data-scene="resistor">电阻</button>
            <button class="scene-tab" data-scene="diode">二极管</button>
            <button class="scene-tab" data-scene="loop">小灯泡</button>
          </span>
        </div>
        <div id="benchBox"></div>
      </div>

      <div id="hazardBox" class="hazard"></div>
    </div>
  </main>
</div>
<script>
window.MM6 = window.MM6 || {};
(function (NS) {
'use strict';

var HEAD = { Ig: 1e-4, Rg: 1000 };
HEAD.Ug = HEAD.Ig * HEAD.Rg;
var OHM_E = 1.5;
var DIAL_FULL = 250;
var OHM_MID_DIAL = 15;
var GRID = 50;

var GEARS = {
mA1:   { id: 'mA1',   fam: 'I', label: '1',    short: '1 mA',   range: 1e-3, unit: 'mA', factor: 1e3 },
mA10:  { id: 'mA10',  fam: 'I', label: '10',   short: '10 mA',  range: 1e-2, unit: 'mA', factor: 1e3 },
mA100: { id: 'mA100', fam: 'I', label: '100',  short: '100 mA', range: 1e-1, unit: 'mA', factor: 1e3 },
V2V5:  { id: 'V2V5',  fam: 'V', label: '2.5',  short: '2.5 V',  range: 2.5,  unit: 'V',  factor: 1 },
V10:   { id: 'V10',   fam: 'V', label: '10',   short: '10 V',   range: 10,   unit: 'V',  factor: 1 },
V50:   { id: 'V50',   fam: 'V', label: '50',   short: '50 V',   range: 50,   unit: 'V',  factor: 1 },
V250:  { id: 'V250',  fam: 'V', label: '250',  short: '250 V',  range: 250,  unit: 'V',  factor: 1 },
Rx1:   { id: 'Rx1',   fam: 'R', label: '×1',   short: '×1',     mult: 1,    mid: 15 },
Rx10:  { id: 'Rx10',  fam: 'R', label: '×10',  short: '×10',    mult: 10,   mid: 150 },
Rx100: { id: 'Rx100', fam: 'R', label: '×100', short: '×100',   mult: 100,  mid: 1500 },
Rx1k:  { id: 'Rx1k',  fam: 'R', label: '×1k',  short: '×1k',    mult: 1000, mid: 15000 }
};
var GEAR_ORDER = ['mA1', 'mA10', 'mA100', 'V2V5', 'V10', 'V50', 'V250', 'Rx1', 'Rx10', 'Rx100', 'Rx1k'];

function params(id) {
var g = GEARS[id];
if (!g) return null;
if (g.fam === 'I') {
return { fam: 'I', Rsh: HEAD.Ig * HEAD.Rg / (g.range - HEAD.Ig), range: g.range };
}
if (g.fam === 'V') {
return { fam: 'V', Rser: g.range / HEAD.Ig - HEAD.Rg, range: g.range };
}
return { fam: 'R', mid: g.mid, mult: g.mult, E: OHM_E };
}

function deflect(id, X, st) {
var g = GEARS[id];
if (!g) return 0;
if (g.fam === 'I' || g.fam === 'V') return X / g.range;
var k = (st && st.kOhm != null) ? st.kOhm : 1;
if (!isFinite(X)) return 0;
return g.mid / (g.mid * k + Math.max(X, 0));
}

function rawPos(id, X, st) {
var off = (st && st.offGrid != null) ? st.offGrid : 0;
return deflect(id, X, st) + off / GRID;
}

function clampPos(p) { return p < 0 ? 0 : (p > 1 ? 1 : p); }

function reading(id, pN) {
var g = GEARS[id];
if (!g) return null;
if (g.fam === 'I' || g.fam === 'V') {
return { fam: g.fam, dial: pN * DIAL_FULL, val: pN * g.range, unit: g.unit, mul: g.range / DIAL_FULL };
}
var d = pN <= 0.004 ? Infinity : OHM_MID_DIAL * (1 - pN) / pN;
return { fam: 'R', dial: d, val: d * g.mult, unit: 'Ω', mult: g.mult };
}

function dialFactor(id) {
var g = GEARS[id];
if (!g) return '';
if (g.fam === 'I' || g.fam === 'V') {
var f = g.range / DIAL_FULL;
return String(f);
}
return '×' + g.mult;
}

function status(id, pRaw) {
if (!id || id === 'OFF') return 'off';
var g = GEARS[id];
if (g && g.fam === 'R') return 'ok';
if (pRaw > 1.015) return 'over';
if (pRaw < -0.015) return 'reverse';
return 'ok';
}

function mechZeroOK(st) { return Math.abs((st && st.offGrid) || 0) <= 0.25; }

function ohmZeroOK(st) { return Math.abs(((st && st.kOhm) || 1) - 1) <= 0.006; }

function headCurrent(id, X, st) {
var g = GEARS[id];
if (!g) return 0;
var p = deflect(id, X, st);
return p * HEAD.Ig;
}

function fmtSig(v, sig) {
if (!isFinite(v)) return '∞';
if (v === 0) return '0';
sig = sig || 3;
var mag = Math.floor(Math.log(Math.abs(v)) / Math.LN10);
var dec = Math.max(0, sig - 1 - mag);
if (dec > 6) dec = 6;
return v.toFixed(dec);
}
function fmtOhm(v) {
if (!isFinite(v)) return '∞';
if (v >= 1e6) return fmtSig(v / 1e6, 2) + ' MΩ';
if (v >= 1e3) return fmtSig(v / 1e3, 3) + ' kΩ';
return fmtSig(v, 2) + ' Ω';
}
function fmtVal(id, v, isOhm) {
if (isOhm) return fmtOhm(v);
var g = GEARS[id];
if (!g) return String(v);
var x = v * g.factor;
var dec = g.range <= 1e-3 ? 2 : (g.range <= 1e-2 ? 1 : (g.fam === 'V' && g.range >= 250 ? 0 : 1));
if (g.fam === 'V' && g.range <= 2.5) dec = 2;
return x.toFixed(dec) + ' ' + g.unit;
}

var SCENES = {
battery: {
id: 'battery', name: '干电池', emf: 1.5, rint: 0.5, kind: 'src',
posts: [{ id: 'bP', label: '+', pot: '+' }, { id: 'bN', label: '−', pot: '-' }],
truth: 1.5
},
resistor: {
id: 'resistor', name: '定值电阻', R: 1200, kind: 'res',
posts: [{ id: 'rA', label: '1', pot: '' }, { id: 'rB', label: '2', pot: '' }],
truth: 1200
},
diode: {
id: 'diode', name: '二极管', Rf: 600, Rr: 2.0e6, kind: 'diode',
posts: [{ id: 'dA', label: '正极', pot: '' }, { id: 'dB', label: '负极', pot: '' }],
truth: 600
},
loop: {
id: 'loop', name: '电池 + 小灯泡（串一个断口）', emf: 3.0, rint: 0.5, Rload: 39, kind: 'loop',
posts: [{ id: 'lA', label: 'a', pot: '' }, { id: 'lB', label: 'b', pot: '' }],
truth: 3.0 / 39.5
}
};

function ohmResistanceOf(scene, redPost, blackPost) {
if (!scene) return Infinity;
if (scene.kind === 'res') return scene.R;
if (scene.kind === 'diode') {

if (blackPost === 'dA') return scene.Rf;
return scene.Rr;
}
if (scene.kind === 'src') return 2000;
if (scene.kind === 'loop') return scene.Rload + scene.rint;
return Infinity;
}

function measurand(st) {
var sc = SCENES[st.scene];
if (!sc) return { X: 0, note: '未接被测物' };
var red = st.probes.red, black = st.probes.black;
var gear = GEARS[st.gear];
if (!gear) return { X: 0, note: '挡位在 OFF' };

if (st.shorted) {
if (gear.fam === 'R') return { X: 0, note: '表笔短接：指针应指到 0 Ω' };
return { X: 0, note: '表笔短接' };
}
if (!red || !black) {
if (gear.fam === 'R') return { X: Infinity, note: '表笔悬空：欧姆挡外电路断开，指针应该停在最左端 ∞' };
return { X: 0, note: '表笔还没接到被测物上' };
}
if (red === black) {
if (gear.fam === 'R') return { X: 0, note: '两根表笔碰在同一个接线柱上，相当于短接' };
return { X: 0, note: '两根表笔接在同一个接线柱上' };
}

if (sc.kind === 'src') {
if (gear.fam === 'V') {
var pos = (red === 'bP' && black === 'bN');
var rev = (red === 'bN' && black === 'bP');
if (pos) return { X: sc.emf, note: '红笔接正极、黑笔接负极 —— 正确' };
if (rev) return { X: -sc.emf, note: '表笔接反了，指针会反向偏转' };
return { X: 0, note: '表笔没跨在电池两端' };
}
if (gear.fam === 'R') return { X: 5, note: '⚠ 用欧姆挡去测带电的电池：内外两个电池顺向串起来，指针会猛打' };
return { X: 0, note: '电流挡要串联，不能直接并在电池两端' };
}

if (sc.kind === 'res') {
if (gear.fam === 'R') return { X: sc.R, note: '欧姆挡测电阻' };
return { X: 0, note: '电阻本身没有电源，电压/电流挡不会有读数' };
}

if (sc.kind === 'diode') {
if (gear.fam === 'R') {
var R = (black === 'dA') ? sc.Rf : sc.Rr;
return {
X: R,
note: (black === 'dA')
? '黑表笔接正极：内部电池正向导通，电阻小'
: '红表笔接正极：内部电池反向，电阻很大'
};
}
return { X: 0, note: '二极管要用欧姆挡测正反向电阻' };
}

if (sc.kind === 'loop') {
var acrossBreak = (red === 'lA' && black === 'lB') || (red === 'lB' && black === 'lA');
if (gear.fam === 'I') {
if (!acrossBreak) return { X: 0, note: '电流表要串进断口 a、b 之间' };
var I = sc.emf / (sc.Rload + sc.rint);
if (red === 'lA') return { X: I, note: '串联正确：电流从红表笔流入' };
return { X: -I, note: '红黑表笔接反，指针反向偏转' };
}
if (gear.fam === 'V') {
if (!acrossBreak) return { X: 0, note: '没接在断口上' };
return { X: 0, note: '断口被电压表跨接，回路几乎不通（灯不亮）' };
}
return { X: sc.Rload + sc.rint, note: '欧姆挡测的是断口两端的电阻' };
}
return { X: 0, note: '' };
}

function hazard(st, meas) {
var g = GEARS[st.gear];
if (!g) return null;
var sc = SCENES[st.scene];
if (sc && sc.kind === 'src' && g.fam === 'R' && st.probes.red && st.probes.black) {
return '欧姆挡内部有电池，再用它去测电池，两只电池顺向串起来，电流很大 —— 表针会猛打，甚至烧表。';
}
if (sc && sc.kind === 'loop' && g.fam === 'V' && isFinite(meas.X) && meas.X === 0 &&
st.probes.red && st.probes.black && st.probes.red !== st.probes.black) {
return '把电压表并进断口，等于给电路串了一个很大的电阻：回路电流几乎为零，灯不会亮。';
}
return null;
}

function runSelfTest() {
var cases = [], fail = 0;
function T(name, got, want, tol) {
tol = tol == null ? 1e-9 : tol;
var ok = Math.abs(got - want) <= tol;
if (!ok) fail++;
cases.push({ name: name, got: got, want: want, ok: ok });
return ok;
}

T('表头 Ug = Ig·Rg', HEAD.Ug, 0.1, 1e-12);

T('1 mA 挡分流电阻', params('mA1').Rsh, 111.111, 0.01);
T('10 mA 挡分流电阻', params('mA10').Rsh, 10.101, 0.01);
T('100 mA 挡分流电阻', params('mA100').Rsh, 1.001, 0.01);

T('2.5 V 挡分压电阻', params('V2V5').Rser, 24000, 1);
T('10 V 挡分压电阻', params('V10').Rser, 99000, 1);
T('250 V 挡分压电阻', params('V250').Rser, 2499000, 500);

T('1 mA 挡满偏', headCurrent('mA1', 1e-3), HEAD.Ig, 1e-12);
T('10 V 挡满偏', headCurrent('V10', 10), HEAD.Ig, 1e-12);

T('欧姆 ×1 中值 Rx=15Ω → p=0.5', deflect('Rx1', 15, { kOhm: 1 }), 0.5, 1e-12);
T('欧姆 ×100 中值 Rx=1.5kΩ → p=0.5', deflect('Rx100', 1500, { kOhm: 1 }), 0.5, 1e-12);

var p = deflect('Rx100', 1200, { kOhm: 1 });
var rd = reading('Rx100', p);
T('×100 测 1.2kΩ 读数', rd.val, 1200, 1);

var p2 = deflect('Rx100', 1200, { kOhm: 1.05 });
var rd2 = reading('Rx100', p2);
T('未调零(k=1.05)偏差', rd2.val - 1200, 75, 1);

T('k=1.12 短接指针位置', deflect('Rx100', 0, { kOhm: 1.12 }), 1 / 1.12, 1e-12);

T('机械零位 2.5 格', rawPos('V2V5', 0, { offGrid: 2.5 }), 0.05, 1e-12);

T('3V/39Ω 回路电流', 3.0 / 39.5, 0.07595, 1e-4);

var g = document.getElementById('gearBody');
if (g) g.innerHTML = knobMarkup(id);
}

function knobLineD(cx, cy, R, angle01) {
var deg = -135 + 270 * angle01;
var a = deg * Math.PI / 180;
return 'M' + cx + ' ' + cy + 'L' + (cx + (R - 10) * Math.sin(a)).toFixed(2) + ' ' + (cy - (R - 10) * Math.cos(a)).toFixed(2);
}

function knobSvg(id, label, sub, color, angle01) {
var s = '';
var cx = 70, cy = 70, R = 42;
s += '<circle cx="' + cx + '" cy="' + cy + '" r="' + (R + 8) + '" fill="#f4f7fb" stroke="#e0e7ef" stroke-width="2"/>';
s += '<circle class="knob" data-knob="' + id + '" cx="' + cx + '" cy="' + cy + '" r="' + R + '" fill="#37474f" stroke="#2c3e50" stroke-width="3" style="cursor:grab"/>';
s += '<path class="knobline" d="' + knobLineD(cx, cy, R, angle01) + '" stroke="#ffffff" stroke-width="5" stroke-linecap="round" pointer-events="none"/>';
s += '<circle cx="' + cx + '" cy="' + cy + '" r="6" fill="' + color + '" pointer-events="none"/>';
s += '<text x="70" y="140" fill="' + C.ink + '" font-size="14" font-weight="700" text-anchor="middle">' + label + '</text>';
s += '<text x="70" y="160" fill="#546e7a" font-size="12" text-anchor="middle">' + sub + '</text>';
return s;
}

function bindKnob(svgEl, knobEl, getVal, setVal) {
if (!knobEl) return;
var dragging = false, lastAng = 0;
function ang(e) {
var r = knobEl.getBoundingClientRect();
var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
return Math.atan2(e.clientY - cy, e.clientX - cx) * 180 / Math.PI;
}
knobEl.onpointerdown = function (e) {
dragging = true; lastAng = ang(e);
try { knobEl.setPointerCapture(e.pointerId); } catch (err) { }
e.preventDefault();
};
knobEl.onpointermove = function (e) {
if (!dragging) return;
var a = ang(e), d = a - lastAng;
while (d > 180) d -= 360;
while (d < -180) d += 360;
lastAng = a;
if (Math.abs(d) < 0.01) return;
setVal(Math.max(0, Math.min(1, getVal() + d / 300)));
};
knobEl.onpointerup = function (e) {
dragging = false;
try { knobEl.releasePointerCapture(e.pointerId); } catch (err) { }
};
knobEl.onpointercancel = knobEl.onpointerup;
}

function mountZero(el, cb) {
el.innerHTML = '<svg viewBox="0 0 340 180" style="display:block;width:100%;height:100%">' +
'<g id="mechKnob" transform="translate(15,0)">' + knobSvg('mech', '机械调零', '让指针回到左端 0', C.red, 0.5) + '</g>' +
'<g id="ohmKnob" transform="translate(175,0)">' + knobSvg('ohm', '欧姆调零', '短接时调到 0 Ω', C.volt, 0.5) + '</g></svg>';
rebindZero(el, cb);
}
function setZeroKnobs(mech01, ohm01) {
var m = document.querySelector('#mechKnob .knobline');
var o = document.querySelector('#ohmKnob .knobline');
if (m) m.setAttribute('d', knobLineD(70, 70, 42, mech01));
if (o) o.setAttribute('d', knobLineD(70, 70, 42, ohm01));
}
function rebindZero(el, cb) {
var svg = el.querySelector('svg');
if (!svg) return;
var mechCtl = el.querySelector('#mechKnob .knob'), ohmCtl = el.querySelector('#ohmKnob .knob');
if (mechCtl) bindKnob(svg, mechCtl, function () { return cb.getMech(); }, function (v) { cb.setMech(v); });
if (ohmCtl) bindKnob(svg, ohmCtl, function () { return cb.getOhm(); }, function (v) { cb.setOhm(v); });
}

var SCENE_ART = {

},
resistor: {

'<rect x="162" y="94" width="10" height="28" fill="#8a6d3b"/><rect x="180" y="94" width="8" height="28" fill="#c0392b"/>' +

},
diode: {

},
loop: {
posts: { lA: [162, 158], lB: [238, 158] },
art: '<path d="M112 158V86h176v72" fill="none" stroke="#546e7a" stroke-width="2.5"/>' +
'<rect x="86" y="66" width="54" height="30" rx="4" fill="#fff3cd" stroke="#e67e22" stroke-width="2"/>' +

'<text x="200" y="204" fill="#c0392b" font-size="12.5" font-weight="700" text-anchor="middle">断口：电流表串这里</text>'
}
};

function probeArt(color, dark) {
return '<path d="M0 0 L0 -58" stroke="' + dark + '" stroke-width="12" stroke-linecap="round"/>' +
'<path d="M0 0 L0 -58" stroke="' + color + '" stroke-width="6.5" stroke-linecap="round"/>' +
'<circle cx="0" cy="0" r="9" fill="' + color + '" stroke="' + dark + '" stroke-width="2"/>' +
'<circle cx="0" cy="-58" r="6" fill="' + dark + '"/>';
}

function mountProbe(el, sceneId, pos, onMove, onDrop) {
var art = SCENE_ART[sceneId];
var s = '<svg id="benchSvg" viewBox="0 0 400 250" style="display:block;width:100%;height:100%;touch-action:none">';
s += '<rect x="6" y="6" width="388" height="238" rx="12" fill="#fbfdff" stroke="#e0e7ef" stroke-width="2"/>';
s += '<text x="200" y="28" fill="#90a4ae" font-size="12" text-anchor="middle">把两根表笔拖到接线柱上（两笔尖碰到一起＝短接）</text>';
s += '<g id="sceneArt">' + art.art + '</g>';
for (var pid in art.posts) {
var p = art.posts[pid];
s += '<circle class="post" data-post="' + pid + '" cx="' + p[0] + '" cy="' + p[1] + '" r="11" fill="#ffffff" stroke="#546e7a" stroke-width="2.5" style="cursor:pointer"/>';
s += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="4" fill="#546e7a" pointer-events="none"/>';
}
s += '<g id="probeRed" class="probe" data-probe="red" transform="translate(' + pos.red.x + ',' + pos.red.y + ')" style="cursor:grab">' + probeArt('#c0392b', '#7b241c') + '</g>';
s += '<g id="probeBlack" class="probe" data-probe="black" transform="translate(' + pos.black.x + ',' + pos.black.y + ')" style="cursor:grab">' + probeArt('#2c3e50', '#111111') + '</g>';
s += '<text x="64" y="242" fill="#c0392b" font-size="13" font-weight="800" text-anchor="middle">红表笔</text>';
s += '<text x="336" y="242" fill="#2c3e50" font-size="13" font-weight="800" text-anchor="middle">黑表笔</text>';
s += '</svg>';
el.innerHTML = s;

var svg = el.querySelector('svg');
var drag = null;
function toLocal(e) {
var pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
var m = svg.getScreenCTM().inverse();
var q = pt.matrixTransform(m);
return { x: q.x, y: q.y };
}
svg.addEventListener('pointerdown', function (e) {
var t = e.target.closest ? e.target.closest('.probe') : null;
if (!t) return;
var which = t.getAttribute('data-probe');
var cur = which === 'red' ? pos.red : pos.black;
var loc = toLocal(e);
drag = { which: which, dx: cur.x - loc.x, dy: cur.y - loc.y, el: t };
try { t.setPointerCapture(e.pointerId); } catch (err) { }
e.preventDefault();
});
svg.addEventListener('pointermove', function (e) {
if (!drag) return;
var loc = toLocal(e);
var nx = Math.max(16, Math.min(384, loc.x + drag.dx));
var ny = Math.max(34, Math.min(236, loc.y + drag.dy));
var p = drag.which === 'red' ? pos.red : pos.black;
p.x = nx; p.y = ny;
drag.el.setAttribute('transform', 'translate(' + nx.toFixed(1) + ',' + ny.toFixed(1) + ')');
onMove && onMove(drag.which, nx, ny);
});
function endDrag(e) {
if (!drag) return;
var which = drag.which;
try { drag.el.releasePointerCapture(e.pointerId); } catch (err) { }
drag = null;
onDrop && onDrop(which);
}
svg.addEventListener('pointerup', endDrag);
svg.addEventListener('pointercancel', endDrag);
}

function setProbePos(which, x, y) {
var g = document.getElementById(which === 'red' ? 'probeRed' : 'probeBlack');
if (g) g.setAttribute('transform', 'translate(' + x.toFixed(1) + ',' + y.toFixed(1) + ')');
}

function postPos(sceneId, pid) {
var a = SCENE_ART[sceneId];
return a && a.posts[pid] ? a.posts[pid] : null;
}

NS.BENCH = {
mountGear: mountGear, setGear: setGear,
mountZero: mountZero, setZeroKnobs: setZeroKnobs, rebindZero: rebindZero,
mountProbe: mountProbe, setProbePos: setProbePos, postPos: postPos,
SCENE_ART: SCENE_ART
};
})(window.MM6);
</script>
<script>
window.MM6 = window.MM6 || {};
(function (NS) {
'use strict';
var P = NS.PHY;

var S = {
gear: 'OFF',
offGrid: 0,
kOhm: 1.0,
scene: 'battery',
probes: { red: null, black: null },
pos: { red: { x: 96, y: 220 }, black: { x: 304, y: 220 } },
shorted: false
};

var el = {};
function $(id) { return document.getElementById(id); }

function ctx() {
var meas = P.measurand(S);
var pRaw = P.rawPos(S.gear, meas.X, { kOhm: S.kOhm, offGrid: S.offGrid });
var pShow = P.clampPos(pRaw);
var read = P.reading(S.gear, pShow);
return { st: S, meas: meas, pRaw: pRaw, pShow: pShow, read: read, status: P.status(S.gear, pRaw) };
}

var lastDialGear = '__init__';
function render() {
var c = ctx();
if (lastDialGear !== S.gear) {
NS.DIAL.render($('dialBox'), S.gear);
lastDialGear = S.gear;
}
NS.DIAL.setNeedle(c.pShow);
NS.BENCH.setGear(S.gear);
NS.CIRCUIT.render(S.gear);
updateCirTitle(c);
updateReadout(c);
updateHazard(c);
}

function updateCirTitle(c) {
var e = $('cirNow');
if (!e) return;
var g = P.GEARS[S.gear];
if (!g) { e.textContent = '转动旋钮，看电流走哪一条路'; return; }
var idx = P.GEAR_ORDER.indexOf(S.gear) + 1;
var t = g.fam === 'R' ? ('欧姆 ' + g.label) : (g.fam === 'V' ? (g.range + ' V') : ((g.range * 1000) + ' mA'));
e.textContent = '当前接通：第 ' + idx + ' 条支路 · ' + t;
}

function updateReadout(c) {
var bigEl = $('readBig'), subEl = $('readSub'), tagEl = $('readTag'), noteEl = $('readNote');
var g = P.GEARS[S.gear];
if (!g) {
bigEl.textContent = '—';
bigEl.className = 'read-big off';
subEl.textContent = '旋钮在 OFF：表头没有接入任何电路';
tagEl.textContent = 'OFF'; tagEl.className = 'tag tag-off';
noteEl.textContent = ''; noteEl.className = 'read-note';
return;
}
if (c.status === 'over') {
bigEl.textContent = '超量程';
bigEl.className = 'read-big over';
subEl.textContent = '指针打到右端挡针 —— 换更大的量程';
tagEl.textContent = '打表'; tagEl.className = 'tag tag-over';
noteEl.textContent = c.meas.note || ''; noteEl.className = 'read-note warn';
return;
}
if (c.status === 'reverse') {
bigEl.textContent = '反偏';
bigEl.className = 'read-big over';
subEl.textContent = '指针往左端打 —— 表笔接反了，或者电流方向反了';
tagEl.textContent = '接反'; tagEl.className = 'tag tag-over';
noteEl.textContent = c.meas.note || ''; noteEl.className = 'read-note warn';
return;
}
if (g.fam === 'R') {
if (!isFinite(c.read.val)) {
bigEl.textContent = '∞';
bigEl.className = 'read-big';
subEl.textContent = '指针停在最左端，超出这一挡的范围';
} else {
bigEl.textContent = P.fmtOhm(c.read.val);
bigEl.className = 'read-big';
subEl.textContent = '刻度 ' + (c.read.dial < 10 ? c.read.dial.toFixed(2) : c.read.dial.toFixed(1)) +
' × ' + g.mult + ' = ' + P.fmtOhm(c.read.val);
}
tagEl.textContent = '欧姆挡'; tagEl.className = 'tag tag-ohm';
noteEl.textContent = c.meas.note || '';
noteEl.className = 'read-note';
if (!c.st.probes.red && !c.st.probes.black && !c.st.shorted && isFinite(c.read.dial) && c.read.dial > 150) {
noteEl.textContent = '指针太靠左，换大一点的倍率读得更准';
noteEl.className = 'read-note warn';
}
return;
}
var v = c.read.val;
var txt = g.fam === 'V'
? (g.range <= 50 ? v.toFixed(2) : v.toFixed(1)) + ' V'
: (v * 1000).toFixed(g.range <= 1e-3 ? 2 : 1) + ' mA';
bigEl.textContent = txt;
bigEl.className = 'read-big';
var coef = g.range / P.DIAL_FULL;
subEl.textContent = '刻度 ' + c.read.dial.toFixed(1) + ' × ' + (coef < 0.01 ? coef.toFixed(4) : (coef < 0.1 ? coef.toFixed(3) : coef.toFixed(2))) + ' = ' + txt;
tagEl.textContent = g.fam === 'V' ? '直流电压' : '直流电流';
tagEl.className = 'tag ' + (g.fam === 'V' ? 'tag-v' : 'tag-mA');
noteEl.textContent = c.meas.note || '';
noteEl.className = 'read-note';
}

function updateHazard(c) {
var h = P.hazard(S, c.meas);
var box = $('hazardBox');
if (h) { box.style.display = 'block'; box.textContent = h; }
else { box.style.display = 'none'; }
}

function pickGear(id) { S.gear = id; render(); }

function setScene(id) {
if (id === S.scene) return;
S.scene = id;
S.probes.red = null; S.probes.black = null;
S.pos.red = { x: 96, y: 220 }; S.pos.black = { x: 304, y: 220 };
S.shorted = false;
mountBench();
markScene();
render();
}

function mountBench() {
NS.BENCH.mountProbe($('benchBox'), S.scene, S.pos, function () { }, function (which) { snapProbe(which); });
}

function snapProbe(which) {
var art = NS.BENCH.SCENE_ART[S.scene];
var best = null, bd = 48;
for (var pid in art.posts) {
var q = art.posts[pid];
var d = Math.sqrt(Math.pow(S.pos[which].x - q[0], 2) + Math.pow(S.pos[which].y - q[1], 2));
if (d < bd) { bd = d; best = pid; }
}
if (best) {
var q2 = art.posts[best];
S.pos[which].x = q2[0]; S.pos[which].y = q2[1];
NS.BENCH.setProbePos(which, q2[0], q2[1]);
S.probes[which] = best;
} else {
S.probes[which] = null;
}
var dx = S.pos.red.x - S.pos.black.x, dy = S.pos.red.y - S.pos.black.y;
S.shorted = (Math.sqrt(dx * dx + dy * dy) < 34);
render();
}

function setMech(v01) {
S.offGrid = -3 + 6 * v01;
NS.BENCH.setZeroKnobs(v01, (S.kOhm - 0.85) / 0.35);
render();
}
function setOhm(v01) {
S.kOhm = 0.85 + 0.35 * v01;
NS.BENCH.setZeroKnobs((S.offGrid + 3) / 6, v01);
render();
}
function zeroCb() {
return {
getMech: function () { return (S.offGrid + 3) / 6; },
setMech: setMech,
getOhm: function () { return (S.kOhm - 0.85) / 0.35; },
setOhm: setOhm
};
}

function resetAll() {
S.gear = 'OFF'; S.offGrid = 0; S.kOhm = 1.0;
S.scene = 'battery';
S.probes.red = null; S.probes.black = null;
S.pos.red = { x: 96, y: 220 }; S.pos.black = { x: 304, y: 220 };
S.shorted = false;
mountBench(); markScene();
NS.BENCH.setZeroKnobs((S.offGrid + 3) / 6, (S.kOhm - 0.85) / 0.35);
NS.BENCH.rebindZero($('zeroBox'), zeroCb());
render();
}

function init() {
NS.CIRCUIT.mount($('cirBox'));
NS.BENCH.mountGear($('gearBox'), pickGear);
NS.BENCH.mountZero($('zeroBox'), zeroCb());
mountBench();

document.querySelectorAll('.scene-tab').forEach(function (b) {
b.addEventListener('click', function () { setScene(b.getAttribute('data-scene')); });
});
$('btnReset').addEventListener('click', resetAll);
$('btnFull').addEventListener('click', function () {
var d = document.documentElement;
if (!document.fullscreenElement) { if (d.requestFullscreen) d.requestFullscreen(); }
else if (document.exitFullscreen) document.exitFullscreen();
});
$('btnTest').addEventListener('click', function () {
var r = P.runSelfTest();
alert('物理自检：' + (r.pass ? '全部通过' : r.fail + ' 项失败') + '\n用例 ' + r.total + ' 条');
});
document.addEventListener('keydown', function (e) {
var order = P.GEAR_ORDER;
var i = order.indexOf(S.gear);
if (e.key === 'ArrowRight') { i = (i < 0) ? 0 : Math.min(order.length - 1, i + 1); pickGear(order[i]); e.preventDefault(); }
else if (e.key === 'ArrowLeft') { i = (i < 0) ? 0 : Math.max(0, i - 1); pickGear(order[i]); e.preventDefault(); }
});

NS.BENCH.setZeroKnobs((S.offGrid + 3) / 6, (S.kOhm - 0.85) / 0.35);
NS.BENCH.rebindZero($('zeroBox'), zeroCb());
markScene();
render();
setTimeout(function () {
var db = $('dialBox');
if (db && db.scrollWidth > db.clientWidth + 4) db.scrollLeft = (db.scrollWidth - db.clientWidth) / 2;
}, 420);
window.__mm6 = { state: S, ctx: ctx, render: render, selftest: P.runSelfTest };
window.__viz = { selfTest: function () { return P.runSelfTest(); } };
}

function markScene() {
document.querySelectorAll('.scene-tab').forEach(function (b) {
b.classList.toggle('on', b.getAttribute('data-scene') === S.scene);
});
}

document.addEventListener('DOMContentLoaded', init);
})(window.MM6);
</script>
</body>
</html>
