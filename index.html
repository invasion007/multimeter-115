<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多用电表 · 从一只表头到一块表</title>
<style>
  /* C 基调 · 白底实物风格 */
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,'Microsoft YaHei','PingFang SC',sans-serif;
    background:linear-gradient(135deg,#f5f7fa 0%,#e4edf9 100%);
    color:#333;overflow:hidden;
  }
  .app{display:grid;grid-template-rows:auto auto 1fr auto auto;height:100vh;padding:8px 12px 10px;gap:7px;}
  header{background:rgba(255,255,255,.95);border-radius:12px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);padding:8px 16px;display:flex;align-items:center;gap:12px;
    flex-wrap:nowrap;height:44px;flex:0 0 auto;overflow:hidden;}
  header h1{font-size:1rem;color:#2c3e50;font-weight:600;white-space:nowrap;}
  .act{font-size:.72rem;color:#3498db;background:#eef5fd;border:1px solid #d7e5f7;border-radius:20px;padding:2px 10px;white-space:nowrap;}
  .steptitle{font-size:.88rem;color:#37474f;font-weight:600;flex:1 1 auto;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .stepsn{flex:0 0 auto;margin-left:auto;font-size:.8rem;color:#90a4ae;font-variant-numeric:tabular-nums;}
  .topnav{display:flex;align-items:center;gap:4px;padding:5px 10px;overflow-x:auto;overflow-y:hidden;
    background:#fff;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.06);}
  .topnav .grouplab{flex:0 0 auto;font-size:.68rem;letter-spacing:.3px;color:#90a4ae;font-weight:600;white-space:nowrap;}
  .topnav .sep{flex:0 0 auto;width:1px;height:14px;background:#e0e7ef;margin:0 4px;}
  .topnav a{flex:0 0 auto;min-width:24px;height:21px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center;
    font-size:.74rem;font-variant-numeric:tabular-nums;color:#546e7a;background:#f8fafd;
    border:1px solid #e0e7ef;border-radius:6px;cursor:pointer;text-decoration:none;}
  .topnav a:hover{border-color:#3498db;background:#f1f7ff;}
  .topnav a.on{background:#3498db;border-color:#3498db;color:#fff;font-weight:700;}
  .stage{display:grid;grid-template-columns:1fr 300px;gap:7px;min-height:0;}
  .canvaswrap{position:relative;min-width:0;min-height:0;padding:4px;background:#fff;border-radius:15px;
    box-shadow:0 8px 25px rgba(0,0,0,.08);}
  canvas{display:block;width:100%;height:100%;
    background:linear-gradient(to bottom,#f7fafd,#ffffff);border-radius:11px;}
  aside{background:#fff;border-radius:15px;box-shadow:0 8px 25px rgba(0,0,0,.08);
    padding:11px 13px;overflow-y:auto;min-height:0;}
  aside h3{font-size:.72rem;color:#90a4ae;margin:10px 0 5px;font-weight:600;letter-spacing:.3px;}
  aside h3:first-child{margin-top:0;}
  .rd{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:4px 0;
    font-size:.78rem;color:#546e7a;border-bottom:1px dashed #e0e7ef;}
  .rd span{white-space:nowrap;}
  .rd b{font-size:.9rem;color:#297fb8;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;
    font-family:'Courier New',monospace;}
  .rd b.red{color:#c0392b;} .rd b.green{color:#27ae60;} .rd b.grey{color:#78909c;} .rd b.orange{color:#e67e22;}
  .total{margin-top:8px;padding:9px 11px;background:#DCDCDC;border:1px solid #e9f0f9;
    border-radius:8px;box-shadow:0 4px 8px rgba(0,0,0,.04);text-align:center;}
  .total .lab{font-size:.72rem;color:#546e7a;display:block;margin-bottom:2px;}
  .total b{font-size:1.5rem;color:#297fb8;font-weight:700;font-family:'Courier New',monospace;
    font-variant-numeric:tabular-nums;}
  .formula{font-size:.8rem;color:#1565c0;background:#eef5fd;border:1px solid #d7e5f7;
    border-radius:8px;padding:8px 10px;line-height:1.6;word-break:break-word;}
  .note{font-size:.78rem;color:#37474f;line-height:1.7;}
  .note b{color:#c0392b;font-weight:600;}
  .hint{padding:6px 14px;font-size:.8rem;color:#1565c0;background:rgba(240,248,255,.9);
    border:1px solid #d7e5f7;border-radius:15px;height:32px;flex:0 0 auto;overflow:hidden;
    display:flex;align-items:center;white-space:nowrap;text-overflow:ellipsis;}
  .hint b{color:#3498db;font-weight:600;}
  footer{display:flex;align-items:center;gap:7px;flex-wrap:wrap;row-gap:6px;
    padding:7px 12px;background:#fff;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.06);}
  #ctrls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;row-gap:6px;flex:1 1 100%;}
  .bar{position:relative;flex:1 1 90px;min-width:60px;height:8px;background:#e0e7ef;border-radius:4px;}
  .bar i{display:block;height:100%;width:0;background:#3498db;border-radius:4px;transition:width .2s;}
  .slider{display:flex;align-items:center;gap:6px;font-size:.78rem;color:#546e7a;}
  .slider input[type=range]{width:108px;height:8px;background:#e0e7ef;border-radius:4px;
    outline:none;-webkit-appearance:none;appearance:none;cursor:pointer;}
  .slider input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;
    border-radius:50%;background:#3498db;cursor:pointer;box-shadow:0 2px 5px rgba(0,0,0,.2);}
  .slider b{color:#297fb8;font-variant-numeric:tabular-nums;min-width:54px;text-align:right;
    font-family:'Courier New',monospace;}
  .grp{display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
  .grp .lab{font-size:.74rem;color:#90a4ae;white-space:nowrap;}
  button{font-family:inherit;font-size:.76rem;color:#fff;font-weight:500;
    background:#3498db;border:none;border-radius:8px;padding:5px 11px;cursor:pointer;
    white-space:nowrap;transition:all .2s ease;}
  button:hover{background:#2980b9;transform:translateY(-1px);box-shadow:0 4px 8px rgba(52,152,219,.25);}
  button:active{transform:translateY(0);}
  button.ghost{background:#fff;color:#546e7a;border:1px solid #dde2e9;}
  button.ghost:hover{background:#f1f7ff;border-color:#3498db;box-shadow:none;}
  button.on{background:#2980b9;box-shadow:0 0 0 2px rgba(52,152,219,.3);}
  @media (max-width:900px){
    .stage{grid-template-columns:1fr;grid-template-rows:1fr auto;}
    aside{max-height:24vh;border-radius:12px;}
    .app{padding:5px 7px 7px;gap:5px;}
    header{height:38px;padding:5px 9px;gap:7px;} header h1{font-size:.78rem;} .steptitle{font-size:.72rem;} .act{font-size:.64rem;padding:1px 7px;}
    .hint{height:42px;white-space:normal;line-height:1.4;font-size:.72rem;padding:5px 9px;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
    .slider input[type=range]{width:70px;}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>多用电表 · 从一只表头到一块表</h1>
    <span class="act" id="actTag">第 0 幕</span>
    <span class="steptitle" id="stepTitle">—</span>
    <span class="stepsn" id="stepSn">1 / 20</span>
  </header>

  <nav class="topnav" id="toc"></nav>

  <div class="stage">
    <div class="canvaswrap"><canvas id="cv"></canvas></div>
    <aside>
      <h3>这一刻的量</h3>
      <div id="p1"></div>
      <h3>这一挡的参数</h3>
      <div id="p2"></div>
      <div class="total"><span class="lab">本步结论</span><b id="rdTotal">—</b></div>
      <h3>公式</h3>
      <div class="formula" id="rdFormula">—</div>
      <h3>说明</h3>
      <div class="note" id="rdNote"></div>
    </aside>
  </div>

  <div class="hint" id="hint"></div>

  <footer>
    <button id="btnPrev" class="ghost">◀ 上一步</button>
    <button id="btnNext">下一步 ▶</button>
    <button id="btnReset" class="ghost">↺ 复位本步</button>
    <div class="bar" id="prog"><i></i></div>
    <div id="ctrls"></div>
  </footer>
</div>

<script>


window.VizP4 = (function () {
'use strict';

var IG = 1e-3;
var RG = 100;
var UG = IG * RG;

var R1 = 10 / 9;
var R2 = 10;
var S = R1 + R2;
var I2 = IG * (RG + S) / S;
var I1 = IG * (RG + S) / R1;

var RB = RG * S / (RG + S);

var U5 = 2.5, U6 = 10;
var RV5 = U5 / I2 - RB;
var RV6 = U6 / I2 - RB;
var RV4 = RV6 - RV5;

var E1 = 1.5, E2 = 15;
var M1 = 10, M2 = 100;
var RI1 = E1 / I2;
var RI2 = E2 / I2;
var R01 = RI1 - RB;
var R02 = RI2 - RB;
var MID = 15;

var ROWS = [
{ id: 'ohm', type: 'ohm', name: 'Ω', color: 'red', mid: MID },
{ id: 'u250', type: 'uni', max: 250, div: 5, name: '250', color: 'ink' },
{ id: 'u50', type: 'uni', max: 50, div: 1, name: '50', color: 'ink' },
{ id: 'u10', type: 'uni', max: 10, div: 0.2, name: '10', color: 'ink' }
];

var GEARS = [
{ id: 0, name: 'OFF', short: '关', kind: 'off', row: null, rowMul: 0, unit: '', range: 0,
branch: null, note: '断开 —— 表头不接任何支路，指针不动' },
{ id: 1, name: '100 mA', short: '①', kind: 'A', range: I1, unit: 'mA', row: 'u10', rowMul: 10,
branch: 'i1', note: '电流挡 · 大量程（触点①接 R1 抽头）', dec: 0, divTxt: '2 mA' },
{ id: 2, name: '10 mA', short: '②', kind: 'A', range: I2, unit: 'mA', row: 'u10', rowMul: 1,
branch: 'i2', note: '电流挡 · 小量程（触点②接右端）', dec: 1, divTxt: '0.2 mA' },
{ id: 3, name: 'Ω×10', short: '③', kind: 'R', range: 0, unit: 'Ω', row: 'ohm', rowMul: M1,
branch: 'o1', note: '欧姆挡 ×10 · 1.5 V 电池', mult: M1, rint: RI1, e: E1, dec: 0 },
{ id: 4, name: 'Ω×100', short: '④', kind: 'R', range: 0, unit: 'Ω', row: 'ohm', rowMul: M2,
branch: 'o2', note: '欧姆挡 ×100 · 15 V 叠层电池', mult: M2, rint: RI2, e: E2, dec: 0 },
{ id: 5, name: '2.5 V', short: '⑤', kind: 'V', range: U5, unit: 'V', row: 'u250', rowMul: 0.01,
branch: 'v1', note: '电压挡 · 小量程（串 240 Ω）', dec: 2, divTxt: '0.05 V' },
{ id: 6, name: '10 V', short: '⑥', kind: 'V', range: U6, unit: 'V', row: 'u10', rowMul: 1,
branch: 'v2', note: '电压挡 · 大量程（串 240+750 Ω）', dec: 1, divTxt: '0.2 V' }
];

function gear(id) {
for (var i = 0; i < GEARS.length; i++) { if (GEARS[i].id === id) { return GEARS[i]; } }
return GEARS[0];
}

function fracOf(g, val) {
if (!g || g.kind === 'off') { return 0; }
if (g.kind === 'R') { return g.rint / (g.rint + Math.max(val, 0)); }
if (val == null || !isFinite(val)) { return 0; }
return Math.max(0, Math.min(1, val / g.range));
}
function valueAt(g, f) {
if (!g || g.kind === 'off') { return 0; }
if (g.kind === 'R') {
if (f >= 0.9999) { return 0; }
if (f <= 0.0001) { return Infinity; }
return g.rint * (1 - f) / f;
}
return f * g.range;
}
function ohmFrac(Rx, rint) { return rint / (rint + Math.max(Rx, 0)); }
function ohmScaleAt(f) { return f <= 1e-4 ? Infinity : MID * (1 - f) / f; }
function ohmFracOfScale(v) { return MID / (MID + v); }

function readOf(g, f) {
if (!g || g.kind === 'off') { return { txt: '—', unit: '', value: 0, scale: 0, dec: 0 }; }
if (g.kind === 'R') {
var sc = ohmScaleAt(f);
if (!isFinite(sc)) { return { txt: '∞', unit: 'Ω', value: Infinity, scale: Infinity, dec: 0 }; }
var v = sc * g.mult;
return { txt: fmtOhm(v), unit: 'Ω', value: v, scale: sc, dec: 0 };
}
var rowMax = (g.row === 'u250') ? 250 : 10;
var scaleVal = f * rowMax;
var vv;
if (g.id === 5) { vv = scaleVal * 0.01; }
else if (g.id === 1) { vv = scaleVal * 10; }
else { vv = scaleVal; }
return { txt: vv.toFixed(g.dec), unit: g.unit, value: vv, scale: scaleVal, dec: g.dec };
}
function decimalsOf(g) { return g && g.dec != null ? g.dec : 2; }

function fmt(v, d) {
if (v == null || !isFinite(v)) { return '∞'; }
if (d == null) { d = 2; }
return v.toFixed(d);
}
function fmtOhm(v) {
if (!isFinite(v)) { return '∞'; }
if (v >= 1000) { return (v / 1000).toFixed(v >= 10000 ? 1 : 2) + 'k'; }
if (v >= 100) { return v.toFixed(0); }
if (v >= 10) { return v.toFixed(1); }
return v.toFixed(1);
}
function fmtR(v) { return fmtOhm(v) + ' Ω'; }

var ACTIVE = {
0: [],
1: ['g', 'r1', 'wL', 'wGL', 'wGR', 'wM', 'c1', 'sw1', 'wA', 'wB'],
2: ['g', 'r1', 'r2', 'wL', 'wGL', 'wGR', 'wR2R', 'wRD', 'c2', 'sw2', 'wA', 'wB'],
3: ['g', 'wL', 'wGL', 'wGR', 'wRail', 'e1', 'ro1', 'c3', 'sw3', 'wA', 'wB', 'rx'],
4: ['g', 'wL', 'wGL', 'wGR', 'wRail', 'e2', 'rf2', 'ro2', 'c4', 'sw4', 'wA', 'wB', 'rx'],
5: ['g', 'wL', 'wGL', 'wGR', 'wRail', 'rv5', 'c5', 'sw5', 'wA', 'wB'],
6: ['g', 'wL', 'wGL', 'wGR', 'wRail', 'rv5', 'rv4', 'c6', 'sw6', 'wA', 'wB']
};
function activeOf(id) { return (ACTIVE[id] || []).slice(); }
function isActive(id, eid) { return (ACTIVE[id] || []).indexOf(eid) >= 0; }

var PATH = {
1: ['A', 'wA', 'L', 'r1', 'M', 'c1', 'sw1', 'P', 'wB', 'B'],
2: ['A', 'wA', 'L', 'g', 'R', 'wR2R', 'c2', 'sw2', 'P', 'wB', 'B'],
3: ['B', 'wB', 'P', 'sw3', 'c3', 'ro1', 'e1', 'rail', 'R', 'g', 'L', 'wA', 'A', 'rx'],
4: ['B', 'wB', 'P', 'sw4', 'c4', 'ro2', 'rf2', 'e2', 'rail', 'R', 'g', 'L', 'wA', 'A', 'rx'],
5: ['A', 'wA', 'L', 'g', 'R', 'rail', 'rv5', 'c5', 'sw5', 'P', 'wB', 'B'],
6: ['A', 'wA', 'L', 'g', 'R', 'rail', 'rv5', 'rv4', 'c6', 'sw6', 'P', 'wB', 'B']
};

var OBJS = [
{ id: 'bat15', kind: 'V', name: '干电池', sub: '1.5 V', E: 1.5, r: 0.5, gear: 5, hint: '2.5 V 挡' },
{ id: 'bat9', kind: 'V', name: '叠层电池', sub: '9 V', E: 9.0, r: 2.0, gear: 6, hint: '10 V 挡' },
{ id: 'bulb', kind: 'A', name: '小灯泡', sub: '60 mA', E: 1.5, R: 25, gear: 1, hint: '100 mA 挡' },
{ id: 'led', kind: 'A', name: 'LED 支路', sub: '30 mA', E: 9.0, R: 300, gear: 1, hint: '100 mA 挡' },
{ id: 'r150', kind: 'R', name: '一段电阻', sub: '150 Ω', R: 150, gear: 3, hint: '×10 挡（中值）' },
{ id: 'r15k', kind: 'R', name: '一段电阻', sub: '1.5 kΩ', R: 1500, gear: 4, hint: '×100 挡（中值）' }
];
function obj(id) { for (var i = 0; i < OBJS.length; i++) { if (OBJS[i].id === id) { return OBJS[i]; } } return OBJS[0]; }
function truth(o) {
if (o.kind === 'V') { return o.E; }
if (o.kind === 'A') { return o.E / o.R; }
return o.R;
}
function needGear(o) { return o.gear; }

function selfTest() {
var errs = [], cases = 0;
function ok(cond, msg) { cases++; if (!cond) { errs.push(msg); } }
function near(a, b, tol, msg) { cases++; if (!(Math.abs(a - b) <= (tol == null ? 1e-9 : tol))) { errs.push(msg + ' got=' + a + ' want=' + b); } }

near(IG, 0.001, 1e-12, 'Ig = 1 mA');
near(RG, 100, 1e-12, 'Rg = 100 Ω');
near(UG, 0.1, 1e-12, 'Ug = Ig·Rg = 0.1 V');

near(R1, 10 / 9, 1e-12, 'R1 = 10/9 Ω');
near(R2, 10, 1e-12, 'R2 = 10 Ω');
near(I2, 0.01, 1e-9, '触点② = 10 mA');
near(I1, 0.1, 1e-9, '触点① = 100 mA');
ok(I1 > I2, '① 量程大于 ②');
near(I1 / I2, 10, 1e-9, '两挡量程比 10:1');
near(RB, 10, 1e-9, '复合表头内阻 10 Ω');
near(I2 * RB, UG, 1e-12, '复合表头满偏电压仍是 0.1 V');
near(IG / I2, S / (RG + S), 1e-12, '满偏时表头分得 1/10 电流');

near(RV5, 240, 1e-9, '2.5 V 挡串 240 Ω');
near(RV6, 990, 1e-9, '10 V 挡串 990 Ω');
near(RV4, 750, 1e-9, '第二段 750 Ω');
near(U5 / (RB + RV5), I2, 1e-12, '2.5 V 挡满偏电流 = 10 mA');
near(U6 / (RB + RV6), I2, 1e-12, '10 V 挡满偏电流 = 10 mA');

near(RI1, 150, 1e-9, '×10 中值 150 Ω');
near(RI2, 1500, 1e-9, '×100 中值 1500 Ω');
near(E1 / RI1, I2, 1e-12, '×10 短路满偏 10 mA');
near(E2 / RI2, I2, 1e-12, '×100 短路满偏 10 mA');
near(ohmScaleAt(0.5), MID, 1e-12, 'Ω 尺中值 15');
near(ohmFrac(0, RI1), 1, 1e-12, 'Rx=0 → 满偏 0 Ω');
near(ohmFrac(RI1, RI1), 0.5, 1e-12, 'Rx=R内 → 半偏 15 格');
ok(ohmFrac(1e9, RI1) < 0.001, 'Rx 极大 → 指针归左 ∞');

near(MID * M1, RI1, 1e-9, '中值 15 × 10 = 150 Ω');
near(MID * M2, RI2, 1e-9, '中值 15 × 100 = 1500 Ω');

near(readOf(gear(5), 0.6).value, 1.5, 1e-9, '2.5 V 挡：0–250 排 150 → 1.50 V');
near(readOf(gear(6), 0.72).value, 7.2, 1e-9, '10 V 挡：0–10 排 7.2 → 7.2 V');
near(readOf(gear(2), 0.6).value, 6.0, 1e-9, '10 mA 挡：0–10 排 6.0 → 6.0 mA');
near(readOf(gear(1), 0.6).value, 60, 1e-9, '100 mA 挡：0–10 排 6.0 → 60 mA');
near(readOf(gear(3), 0.5).value, 150, 1e-9, '×10 中点 → 150 Ω');
near(readOf(gear(4), 0.5).value, 1500, 1e-9, '×100 中点 → 1500 Ω');

for (var i = 1; i <= 6; i++) {
ok(activeOf(i).length > 0, '挡位 ' + i + ' 有高亮');
ok(activeOf(i).indexOf('g') >= 0, '挡位 ' + i + ' 表头在回路');
ok(activeOf(i).indexOf('c' + i) >= 0, '挡位 ' + i + ' 自身触点高亮');
ok(PATH[i] && PATH[i].length > 4, '挡位 ' + i + ' 有电流路径');
}
ok(activeOf(0).length === 0, 'OFF 无高亮');
ok(activeOf(5).indexOf('rv5') >= 0 && activeOf(5).indexOf('rv4') < 0, '2.5 V 只用第一段串阻');
ok(activeOf(6).indexOf('rv4') >= 0, '10 V 用两段串阻');
ok(activeOf(3).indexOf('e1') >= 0 && activeOf(3).indexOf('e2') < 0, '×10 只用 1.5 V');
ok(activeOf(4).indexOf('e2') >= 0, '×100 用 15 V');
ok(activeOf(1).indexOf('r1') >= 0, '100 mA 用 R1 抽头');
ok(activeOf(2).indexOf('r2') >= 0, '10 mA 用右端');

ok(activeOf(3).indexOf('ro2') < 0 && activeOf(4).indexOf('ro1') < 0, '两条欧姆支路互斥');

near(truth(obj('bat15')), 1.5, 1e-12, '干电池 1.5 V');
near(truth(obj('bulb')), 0.06, 1e-12, '小灯泡 60 mA');
near(truth(obj('r150')), 150, 1e-12, '电阻 150 Ω');
near(fracOf(gear(5), 1.5), 0.6, 1e-12, '1.5 V 落在 2.5 V 挡 60%');
near(fracOf(gear(6), 9.0), 0.9, 1e-12, '9 V 落在 10 V 挡 90%');
near(fracOf(gear(1), 0.06), 0.6, 1e-12, '60 mA 落在 100 mA 挡 60%');
near(fracOf(gear(3), 150), 0.5, 1e-12, '150 Ω 在 ×10 挡正中');
near(fracOf(gear(4), 1500), 0.5, 1e-12, '1.5 kΩ 在 ×100 挡正中');

(function () {
'use strict';
var P = window.VizP4, S = window.VizS4, V = window.VizV4;

var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var W = 0, H = 0;
var idx = 0;
var st = S.baseState();

function esc(s) {
return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

/* ---------------- 画布 ---------------- */
function fitCanvas() {
var wrap = cv.parentElement;
var w = Math.max(320, Math.floor(wrap.clientWidth - 8));
var h = Math.max(240, Math.floor(wrap.clientHeight - 6));
if (w === W && h === H) { return; }
W = w; H = h;
var dpr = Math.min(2, window.devicePixelRatio || 1);
cv.width = Math.floor(w * dpr);
cv.height = Math.floor(h * dpr);
cv.style.width = w + 'px';
cv.style.height = h + 'px';
ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

/* ---------------- 步骤 ---------------- */
function applyStep(i) {
idx = Math.max(0, Math.min(S.STEPS.length - 1, i));
var def = S.STEPS[idx];
var base = S.baseState();
st = base;
st.view = def.view;
st.useKind = def.useKind || null;
if (def.init) { def.init(st); }
st.title = def.title;
st.hint = def.hint;
st.note = def.note;
st.formula = def.formula;
st.allowMap = def.allow ? def.allow(st) : {};
st.act = def.act;
render();
}

function allowKeys() { return Object.keys(st.allowMap || {}); }

/* ---------------- 渲染 ---------------- */
function derive() {
/* 面板 / 练习 / 单表使用：指针位置由"挡位 + 被测对象"决定 */
if (st.view === 'panel' || st.view === 'practice' || st.view === 'use') {
if (st.view === 'use' && st.useKind === 'R') { st.gear = st.mult === 100 ? 4 : 3; }
if (st.view === 'use' && st.useKind === 'V') { st.gear = st.gear === 6 ? 6 : 5; }
if (st.view === 'use' && st.useKind === 'A') { st.gear = st.gear === 2 ? 2 : 1; }
var g = P.gear(st.gear || 0);
if ((st.view === 'use' || st.view === 'practice') && st.objId) {
var o = P.obj(st.objId);
st.f = g.kind === 'off' ? 0 : P.fracOf(g, P.truth(o));
} else {
st.f = st.f == null ? 0 : st.f;
}
st.hotRow = g.row || null;
st.mech = st.mech || 0;
}
}

function render() {
derive();
st.panel = S.panelOf(st);
/* 先更新 DOM（底栏控件数量会改变画布可用高度），再测量画布尺寸，
最后绘制 —— 否则同一屏两次渲染会因尺寸滞后而像素不一致 */
updateChrome();
updatePanel();
updateControls();
fitCanvas();
V.draw(ctx, W, H, st);
}

function updateChrome() {
document.getElementById('actTag').textContent = st.act || '';
document.getElementById('stepTitle').textContent = st.title || '';
document.getElementById('stepSn').textContent = (idx + 1) + ' / ' + S.STEPS.length;
document.getElementById('hint').innerHTML = '<b>提示</b>　' + esc(st.hint || '');
var pct = (idx + 1) / S.STEPS.length * 100;
document.querySelector('#prog i').style.width = pct.toFixed(1) + '%';
buildToc();
}

function buildToc() {
var nav = document.getElementById('toc');
var h = '', lastAct = '', i;
for (i = 0; i < S.STEPS.length; i++) {
var a = S.STEPS[i].act;
if (a !== lastAct) {
if (lastAct) { h += '<span class="sep"></span>'; }
h += '<span class="grouplab">' + /第 (\d) 幕/.exec(a)[1] + '</span>';
lastAct = a;
}
h += '<a href="#" data-i="' + i + '" class="' + (i === idx ? 'on' : '') + '">' + (i + 1) + '</a>';
}
nav.innerHTML = h;
var on = nav.querySelector('a.on');
if (on && on.scrollIntoView) { on.scrollIntoView({ block: 'nearest', inline: 'center' }); }
}

function rowHTML(list) {
var h = '', i;
for (i = 0; i < (list || []).length; i++) {
h += '<div class="rd"><span>' + esc(list[i][0]) + '</span><b class="' + (list[i][2] || '') + '">' + esc(list[i][1]) + '</b></div>';
}
return h;
}
function updatePanel() {
document.getElementById('p1').innerHTML = rowHTML(st.panel.p1);
document.getElementById('p2').innerHTML = rowHTML(st.panel.p2);
document.getElementById('rdTotal').textContent = st.panel.total || '—';
document.getElementById('rdFormula').textContent = st.formula || '—';
document.getElementById('rdNote').innerHTML = esc(st.note || '');
}

/* ---------------- 控件 ---------------- */
var lastBuilt = '';
function updateControls() {
var keys = allowKeys();
var sig = keys.join(',');
var host = document.getElementById('ctrls');
if (sig !== lastBuilt) {
lastBuilt = sig;
var h = '', i;
for (i = 0; i < S.ORDER.length; i++) {
var k = S.ORDER[i];
if (keys.indexOf(k) < 0) { continue; }
var r = S.REG[k];
if (!r) { continue; }
if (r.type === 'range') {
h += '<div class="slider"><span>' + esc(r.label) + '</span>' +
'<input type="range" data-k="' + k + '" min="' + r.min + '" max="' + r.max + '" step="' + r.step + '">' +
'<b id="val_' + k + '">—</b></div>';
} else {
h += '<div class="grp"><span class="lab">' + esc(r.label) + '</span>';
for (var j = 0; j < r.opts.length; j++) {
h += '<button data-k="' + k + '" data-v="' + r.opts[j][0] + '">' + esc(r.opts[j][1]) + '</button>';
}
h += '</div>';
}
}
host.innerHTML = h;
host.querySelectorAll('input[type=range]').forEach(function (el) {
el.addEventListener('input', function () {
var k = el.dataset.k;
st[k] = parseFloat(el.value);
afterControl(k);
});
});
host.querySelectorAll('button[data-k]').forEach(function (el) {
el.addEventListener('click', function () {
var k = el.dataset.k, v = el.dataset.v;
var num = parseFloat(v);
st[k] = isNaN(num) ? v : num;
afterControl(k);
});
});
}
/* 同步数值显示与按钮态 */
var i2;
for (i2 = 0; i2 < keys.length; i2++) {
var k2 = keys[i2], r2 = S.REG[k2];
if (!r2) { continue; }
if (r2.type === 'range') {
var el2 = host.querySelector('input[data-k="' + k2 + '"]');
if (el2) { el2.value = st[k2]; }
var lab = document.getElementById('val_' + k2);
if (lab) { lab.textContent = fmtVal(k2, st[k2]); }
} else {
host.querySelectorAll('button[data-k="' + k2 + '"]').forEach(function (b) {
var numv = parseFloat(b.dataset.v);
var cur = st[k2];
var on = (isNaN(numv) ? b.dataset.v === String(cur) : Math.abs(numv - cur) < 1e-9);
b.className = on ? 'on' : '';
});
}
}
}
function fmtVal(k, v) {
if (v == null) { return '—'; }
if (k === 'needle') { return (v * 100).toFixed(0) + ' %'; }
if (k === 'rsh') { return v.toFixed(2) + ' Ω'; }
if (k === 'I') { return (v * 1000).toFixed(1) + ' mA'; }
if (k === 'U') { return v.toFixed(2) + ' V'; }
if (k === 'rs') { return v.toFixed(0) + ' Ω'; }
if (k === 'rx') { return v.toFixed(0) + ' Ω'; }
if (k === 'r0') { return (v * 100).toFixed(0) + ' %'; }
if (k === 'mech') { return (v * 100).toFixed(0); }
return String(v);
}
function afterControl(k) {
if (k === 'gear' || k === 'gearA' || k === 'gearV' || k === 'mult' || k === 'shorted') {
/* 联动：欧姆挡改倍率时同步 mult */
if (k === 'gear' && (st.gear === 3 || st.gear === 4)) { st.mult = st.gear === 3 ? 10 : 100; }
}
render();
}

/* ---------------- 事件 ---------------- */
function bind() {
document.getElementById('btnPrev').addEventListener('click', function () { go(idx - 1); });
document.getElementById('btnNext').addEventListener('click', function () { go(idx + 1); });
document.getElementById('btnReset').addEventListener('click', function () { applyStep(idx); });
document.getElementById('toc').addEventListener('click', function (e) {
var a = e.target.closest('a[data-i]');
if (!a) { return; }
e.preventDefault();
go(parseInt(a.dataset.i, 10));
});
document.addEventListener('keydown', function (e) {
if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) { return; }
if (e.key === 'ArrowRight' || e.key === 'PageDown') { go(idx + 1); e.preventDefault(); }
if (e.key === 'ArrowLeft' || e.key === 'PageUp') { go(idx - 1); e.preventDefault(); }
});
window.addEventListener('resize', function () { render(); });
}
function go(i) { applyStep(i); }

/* ---------------- 自检 ---------------- */
function selfTest() {
var errs = [], cases = 0;
function ok(c, m) { cases++; if (!c) { errs.push(m); } }
var pt = P.selfTest();
cases += pt.cases; errs = errs.concat(pt.errs);

/* 每一步都能渲染、allow 的 key 都在登记表里、hint 与 allow 一致 */
var save = idx;
for (var i = 0; i < S.STEPS.length; i++) {
applyStep(i);
var keys = allowKeys();
ok(keys.length >= 0, 'step ' + (i + 1) + ' allow 可读');
for (var k = 0; k < keys.length; k++) {
ok(!!S.REG[keys[k]], 'step ' + (i + 1) + ' 控件 ' + keys[k] + ' 未登记');
}
/* 渲染不抛异常 */
try { V.draw(ctx, W || 800, H || 500, st); ok(true, ''); }
catch (e) { ok(false, 'step ' + (i + 1) + ' 渲染异常 ' + e.message); }
ok(!!st.title, 'step ' + (i + 1) + ' 有标题');
ok(!!st.hint, 'step ' + (i + 1) + ' 有提示');
var pn = S.panelOf(st);
ok(!/NaN|undefined/.test(JSON.stringify(pn)), 'step ' + (i + 1) + ' 面板无 NaN');
}
applyStep(save);
return { pass: errs.length === 0, cases: cases, errs: errs.slice(0, 20), steps: S.STEPS.length };
}

/* ---------------- 对外接口（自动化验收用） ---------------- */
window.__viz = {
steps: S.STEPS.length,
goto: function (i) { applyStep(i); },
get state() { return st; },
selfTest: selfTest,
hash: function () {
var d = ctx.getImageData(0, 0, cv.width, cv.height).data;
var h = 2166136261;
for (var i = 0; i < d.length; i += 97) { h ^= d[i]; h = (h * 16777619) >>> 0; }
return h;
},
set: function (k, v) { st[k] = v; render(); }
};

applyStep(0);
bind();
window.addEventListener('load', function () { render(); });
})();

</script>
