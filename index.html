<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>练习使用多用电表 · 虚拟实验台</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC","WenQuanYi Zen Hei",sans-serif;
  background:linear-gradient(135deg,#f5f7fa 0%,#e4edf9 100%);
  color:#333333;overflow:hidden;user-select:none;-webkit-tap-highlight-color:transparent;
}
svg text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC","WenQuanYi Zen Hei",sans-serif}
.app{height:100%;display:flex;flex-direction:column}

/* ---------- 顶栏 ---------- */
header{
  height:54px;margin:10px 12px 0;padding:0 16px;display:flex;align-items:center;gap:18px;
  background:rgba(255,255,255,.95);border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.08);flex:0 0 auto;
}
.h-left{display:flex;align-items:baseline;gap:12px;min-width:0}
.h-left b{font-size:18px;color:#1565c0;letter-spacing:.5px;white-space:nowrap}
.h-left span{font-size:13px;color:#90a4ae;white-space:nowrap}
.h-mid{display:flex;align-items:center;gap:10px;margin-left:auto}
.h-mid #progText{font-size:15px;font-weight:700;color:#297fb8;font-variant-numeric:tabular-nums;white-space:nowrap}
.pbar{width:150px;height:8px;border-radius:5px;background:#e9f0f9;overflow:hidden}
.pbar i{display:block;height:100%;width:12%;background:linear-gradient(90deg,#3498db,#297fb8);border-radius:5px;transition:width .3s}
.h-right{display:flex;gap:8px;margin-left:6px}
.btn{border:1px solid #dde2e9;background:#ffffff;color:#546e7a;border-radius:9px;padding:7px 14px;font-size:14px;
  font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap}
.btn:hover{background:#f1f7ff;border-color:#3498db;color:#2980b9}
.btn-ok{background:#27ae60;border-color:#27ae60;color:#fff;font-weight:700}
.btn-ok:hover{background:#219653;border-color:#219653;color:#fff}
.btn-wait{background:#f7fafd;color:#90a4ae;cursor:default}
.btn-wait:hover{background:#f7fafd;border-color:#dde2e9;color:#90a4ae}
.btn-mini{padding:5px 12px;font-size:13px;border-radius:8px}
.btn-thin{padding:6px 10px;font-size:13px;color:#90a4ae}

/* ---------- 主栅格 ---------- */
main{flex:1;display:grid;grid-template-columns:404px 1fr 404px;gap:12px;padding:10px 12px 12px;min-height:0}
.col{display:flex;flex-direction:column;gap:10px;min-height:0}
.card{background:#ffffff;border-radius:15px;box-shadow:0 8px 25px rgba(0,0,0,.08);padding:10px 14px;
  display:flex;flex-direction:column;min-height:0;position:relative;overflow:hidden}
.card-h{font-size:12.5px;font-weight:700;color:#546e7a;letter-spacing:.2px;display:flex;align-items:center;
  justify-content:space-between;gap:6px;flex:0 0 auto;margin-bottom:4px;white-space:nowrap}
.card-h em{font-style:normal;color:#90a4ae;font-weight:400;font-size:12px}

/* 左栏 */
#gearBox{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#zeroBox{height:196px}
#benchBox{height:262px}

/* 中栏 */
.dial-card{flex:1 1 auto;min-height:0;padding:3px 4px}
.dial-hint{display:none;font-size:11px;color:#90a4ae;text-align:center;padding:2px 0 0}
#dialBox{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.read-card{height:clamp(148px,17vh,182px);flex:0 0 auto;justify-content:center;gap:2px}
.read-head{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:#90a4ae;font-weight:700}
.read-big{font-family:"Courier New",ui-monospace,monospace;font-size:72px;font-weight:700;color:#297fb8;
  line-height:1.02;letter-spacing:-1px;font-variant-numeric:tabular-nums;transition:color .2s}
.read-big.off{color:#b0b0b0}
.read-big.over{color:#c0392b;font-size:56px}
.read-big.quiz{color:#e67e22;letter-spacing:6px}
.read-sub{font-size:14px;color:#546e7a;line-height:1.4}
.read-note{font-size:12.5px;color:#90a4ae;line-height:1.35;min-height:17px}
.read-note.warn{color:#c0392b;font-weight:700}
.tag{font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;background:#eef5fd;color:#1565c0}
.tag-off{background:#f1f7ff;color:#90a4ae}
.tag-over{background:#fdecea;color:#c0392b}
.tag-ohm{background:#fdf0ee;color:#a93226}
.tag-v{background:#eaf4fc;color:#297fb8}
.tag-mA{background:#eafaf1;color:#1e8449}
.cir-card{height:clamp(226px,30vh,330px);flex:0 0 auto}
#cirBox{flex:1;min-height:0}

/* 右栏 */
.hazard{display:none;background:#fff4e5;border:1px solid #f5c99b;border-left:4px solid #e67e22;border-radius:10px;
  padding:9px 12px;font-size:13.5px;color:#8a5a00;line-height:1.5;flex:0 0 auto}
.task-card{flex:1;min-height:0;gap:6px}
.task-kicker{font-size:12px;font-weight:800;color:#3498db;letter-spacing:1px}
#taskTitle{font-size:21px;font-weight:800;color:#2c3e50;line-height:1.25}
#taskTarget{font-size:14px;color:#546e7a;line-height:1.55}
#taskSteps{margin-top:2px;display:flex;flex-direction:column;gap:3px}
.step-row{font-size:13px;color:#90a4ae;display:flex;gap:7px;align-items:center}
.step-row.on{color:#27ae60;font-weight:600}
.step-row .dot{width:16px;text-align:center;font-size:13px}
.hint{font-size:13.5px;line-height:1.6;color:#546e7a;background:#eef5fd;border:1px solid #d7e5f7;border-radius:9px;
  padding:9px 11px;margin-top:auto}
.hint b{color:#27ae60}
#taskBtn{margin-top:8px;width:100%;padding:11px;font-size:15px}
.gear-legend{display:flex;align-items:center;gap:3px;font-size:11px;font-weight:700;color:#546e7a}
.gl{width:8px;height:8px;border-radius:2px;display:inline-block;margin-left:5px}
.gl-ohm{background:#a93226}.gl-v{background:#297fb8}.gl-mA{background:#27ae60}
.scene-tabs{display:flex;gap:4px;flex-wrap:nowrap}
.scene-tab{border:1px solid #dde2e9;background:#fff;color:#546e7a;border-radius:7px;padding:4px 6px;font-size:11.5px;
  cursor:pointer;font-family:inherit;font-weight:600;white-space:nowrap}
.scene-tab.on{background:#3498db;border-color:#3498db;color:#fff}
.quiz-input{width:110px;font-size:20px;font-family:"Courier New",monospace;font-weight:700;color:#297fb8;
  border:0;border-bottom:2px solid #3498db;background:transparent;outline:none;padding:0 4px;margin:0 6px}
.quiz-unit{font-size:16px;color:#546e7a;margin-right:10px}

/* 窄屏 */
@media (max-width:1520px){
  main{grid-template-columns:318px 1fr 330px}
  .read-big{font-size:64px}
  #taskTitle{font-size:19px}
}
@media (max-width:1200px){
  html,body{overflow:auto}
  main{grid-template-columns:1fr;padding-bottom:20px}
  .col{min-height:auto}
  .dial-card{height:auto}
  #dialBox{height:340px}
  #gearBox{height:360px}
  .read-card{height:150px}
  .cir-card{height:280px}
  .h-left span{display:none}
  .pbar{width:90px}
}
@media (max-width:760px){
  header{height:auto;flex-wrap:wrap;padding:8px 10px;gap:6px}
  .h-left{flex:1 1 100%}
  .h-mid{flex:0 0 auto;order:2}
  .h-right{flex:1 1 auto;order:3;justify-content:flex-end;gap:4px}
  .btn{padding:5px 8px;font-size:12px;border-radius:7px}
  .h-left b{font-size:15px}
  .cir-card{overflow-x:auto}
  #cirSvg{min-width:660px}
  .col:nth-child(2){order:1}
  .col:nth-child(1){order:2}
  .col:nth-child(3){order:3}
  .dial-card{height:auto;overflow-x:auto;overflow-y:hidden}
  #dialSvg{min-width:720px}
  .dial-hint{display:block}
  .read-card{height:132px}
  .read-big{font-size:46px}
  .cir-card{height:260px}
  .h-left b{font-size:16px}
  .read-big{font-size:48px}
  #dialBox{height:260px}
  #gearBox{height:320px}
  .h-right{flex-wrap:wrap}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="h-left"><b>练习使用多用电表</b><span>虚拟实验台 · 表盘 / 挡位 / 内部电路 一一对应</span></div>
    <div class="h-mid"><span id="progText">1 / 8</span><div class="pbar"><i id="progBar"></i></div></div>
    <div class="h-right">
      <button id="btnFree" class="btn">自由练习</button>
      <button id="btnQuiz" class="btn">考考我</button>
      <button id="btnFull" class="btn">全屏</button>
      <button id="btnTest" class="btn btn-thin">自检</button>
      <button id="btnReset" class="btn">重置</button>
    </div>
  </header>

  <main>
    <!-- 左：操作台 -->
    <section class="col">
      <div class="card">
        <div class="card-h">选择开关
          <span class="gear-legend"><i class="gl gl-ohm"></i>Ω<i class="gl gl-v"></i>V<i class="gl gl-mA"></i>mA</span>
        </div>
        <div id="gearBox"></div>
      </div>
      <div class="card">
        <div class="card-h">两个调零旋钮<em>拖动圆盘</em></div>
        <div id="zeroBox"></div>
      </div>
      <div class="card">
        <div class="card-h">表笔与被测物
          <span class="scene-tabs">
            <button class="scene-tab" data-scene="battery">电池</button>
            <button class="scene-tab" data-scene="resistor">电阻</button>
            <button class="scene-tab" data-scene="diode">二极管</button>
            <button class="scene-tab" data-scene="loop">小灯泡</button>
          </span>
        </div>
        <div id="benchBox"></div>
      </div>
    </section>

    <!-- 中：表盘 + 读数 + 内部电路 -->
    <section class="col">
      <div class="card dial-card"><div id="dialBox"></div>
        <div class="dial-hint">← 左右滑动看完整表盘 →</div></div>
      <div class="card read-card">
        <div class="read-head"><span>读数</span><span id="readTag" class="tag tag-off">OFF</span></div>
        <div id="readBig" class="read-big off">—</div>
        <div id="readSub" class="read-sub">旋钮在 OFF：表头没有接入任何电路</div>
        <div id="readNote" class="read-note"></div>
      </div>
      <div class="card cir-card">
        <div class="card-h">内部电路 · 这一挡是谁在工作<em>跟着旋钮实时变</em></div>
        <div id="cirBox"></div>
      </div>
    </section>

    <!-- 右：任务 -->
    <section class="col">
      <div id="hazardBox" class="hazard"></div>
      <div class="card task-card">
        <div class="task-kicker" id="taskKicker">第 1 / 8 关</div>
        <h2 id="taskTitle">机械调零</h2>
        <p id="taskTarget"></p>
        <div id="taskSteps"></div>
        <div id="taskHint" class="hint"></div>
        <button id="taskBtn" class="btn btn-wait">还没完成</button>
      </div>
    </section>
  </main>
</div>
<script>
window.MM6 = window.MM6 || {};
(function (NS) {
'use strict';

var HEAD = { Ig: 1e-4, Rg: 1000 };
HEAD.Ug = HEAD.Ig * HEAD.Rg;
var OHM_E = 1.5;
var DIAL_FULL = 250;
var OHM_MID_DIAL = 15;
var GRID = 50;

var GEARS = {
mA1:   { id: 'mA1',   fam: 'I', label: '1',    short: '1 mA',   range: 1e-3, unit: 'mA', factor: 1e3 },
mA10:  { id: 'mA10',  fam: 'I', label: '10',   short: '10 mA',  range: 1e-2, unit: 'mA', factor: 1e3 },
mA100: { id: 'mA100', fam: 'I', label: '100',  short: '100 mA', range: 1e-1, unit: 'mA', factor: 1e3 },
V2V5:  { id: 'V2V5',  fam: 'V', label: '2.5',  short: '2.5 V',  range: 2.5,  unit: 'V',  factor: 1 },
V10:   { id: 'V10',   fam: 'V', label: '10',   short: '10 V',   range: 10,   unit: 'V',  factor: 1 },
V50:   { id: 'V50',   fam: 'V', label: '50',   short: '50 V',   range: 50,   unit: 'V',  factor: 1 },
V250:  { id: 'V250',  fam: 'V', label: '250',  short: '250 V',  range: 250,  unit: 'V',  factor: 1 },
Rx1:   { id: 'Rx1',   fam: 'R', label: '×1',   short: '×1',     mult: 1,    mid: 15 },
Rx10:  { id: 'Rx10',  fam: 'R', label: '×10',  short: '×10',    mult: 10,   mid: 150 },
Rx100: { id: 'Rx100', fam: 'R', label: '×100', short: '×100',   mult: 100,  mid: 1500 },
Rx1k:  { id: 'Rx1k',  fam: 'R', label: '×1k',  short: '×1k',    mult: 1000, mid: 15000 }
};
var GEAR_ORDER = ['mA1', 'mA10', 'mA100', 'V2V5', 'V10', 'V50', 'V250', 'Rx1', 'Rx10', 'Rx100', 'Rx1k'];

function params(id) {
var g = GEARS[id];
if (!g) return null;
if (g.fam === 'I') {
return { fam: 'I', Rsh: HEAD.Ig * HEAD.Rg / (g.range - HEAD.Ig), range: g.range };
}
if (g.fam === 'V') {
return { fam: 'V', Rser: g.range / HEAD.Ig - HEAD.Rg, range: g.range };
}
return { fam: 'R', mid: g.mid, mult: g.mult, E: OHM_E };
}

function deflect(id, X, st) {
var g = GEARS[id];
if (!g) return 0;
if (g.fam === 'I' || g.fam === 'V') return X / g.range;
var k = (st && st.kOhm != null) ? st.kOhm : 1;
if (!isFinite(X)) return 0;
return g.mid / (g.mid * k + Math.max(X, 0));
}

function rawPos(id, X, st) {
var off = (st && st.offGrid != null) ? st.offGrid : 0;
return deflect(id, X, st) + off / GRID;
}

function clampPos(p) { return p < 0 ? 0 : (p > 1 ? 1 : p); }

function reading(id, pN) {
var g = GEARS[id];
if (!g) return null;
if (g.fam === 'I' || g.fam === 'V') {
return { fam: g.fam, dial: pN * DIAL_FULL, val: pN * g.range, unit: g.unit, mul: g.range / DIAL_FULL };
}
var d = pN <= 0.004 ? Infinity : OHM_MID_DIAL * (1 - pN) / pN;
return { fam: 'R', dial: d, val: d * g.mult, unit: 'Ω', mult: g.mult };
}

function dialFactor(id) {
var g = GEARS[id];
if (!g) return '';
if (g.fam === 'I' || g.fam === 'V') {
var f = g.range / DIAL_FULL;
return String(f);
}
return '×' + g.mult;
}

function status(id, pRaw) {
if (!id || id === 'OFF') return 'off';
var g = GEARS[id];
if (g && g.fam === 'R') return 'ok';
if (pRaw > 1.015) return 'over';
if (pRaw < -0.015) return 'reverse';
return 'ok';
}

function mechZeroOK(st) { return Math.abs((st && st.offGrid) || 0) <= 0.25; }

function ohmZeroOK(st) { return Math.abs(((st && st.kOhm) || 1) - 1) <= 0.006; }

function headCurrent(id, X, st) {
var g = GEARS[id];
if (!g) return 0;
var p = deflect(id, X, st);
return p * HEAD.Ig;
}

function fmtSig(v, sig) {
if (!isFinite(v)) return '∞';
if (v === 0) return '0';
sig = sig || 3;
var mag = Math.floor(Math.log(Math.abs(v)) / Math.LN10);
var dec = Math.max(0, sig - 1 - mag);
if (dec > 6) dec = 6;
return v.toFixed(dec);
}
function fmtOhm(v) {
if (!isFinite(v)) return '∞';
if (v >= 1e6) return fmtSig(v / 1e6, 2) + ' MΩ';
if (v >= 1e3) return fmtSig(v / 1e3, 3) + ' kΩ';
return fmtSig(v, 2) + ' Ω';
}
function fmtVal(id, v, isOhm) {
if (isOhm) return fmtOhm(v);
var g = GEARS[id];
if (!g) return String(v);
var x = v * g.factor;
var dec = g.range <= 1e-3 ? 2 : (g.range <= 1e-2 ? 1 : (g.fam === 'V' && g.range >= 250 ? 0 : 1));
if (g.fam === 'V' && g.range <= 2.5) dec = 2;
return x.toFixed(dec) + ' ' + g.unit;
}

var SCENES = {
battery: {
id: 'battery', name: '干电池', emf: 1.5, rint: 0.5, kind: 'src',
posts: [{ id: 'bP', label: '+', pot: '+' }, { id: 'bN', label: '−', pot: '-' }],
truth: 1.5
},
resistor: {
id: 'resistor', name: '定值电阻', R: 1200, kind: 'res',
posts: [{ id: 'rA', label: '1', pot: '' }, { id: 'rB', label: '2', pot: '' }],
truth: 1200
},
diode: {
id: 'diode', name: '二极管', Rf: 600, Rr: 2.0e6, kind: 'diode',
posts: [{ id: 'dA', label: '正极', pot: '' }, { id: 'dB', label: '负极', pot: '' }],
truth: 600
},
loop: {
id: 'loop', name: '电池 + 小灯泡（串一个断口）', emf: 3.0, rint: 0.5, Rload: 39, kind: 'loop',
posts: [{ id: 'lA', label: 'a', pot: '' }, { id: 'lB', label: 'b', pot: '' }],
truth: 3.0 / 39.5
}
};

function ohmResistanceOf(scene, redPost, blackPost) {
if (!scene) return Infinity;
if (scene.kind === 'res') return scene.R;
if (scene.kind === 'diode') {

if (blackPost === 'dA') return scene.Rf;
return scene.Rr;
}
if (scene.kind === 'src') return 2000;
if (scene.kind === 'loop') return scene.Rload + scene.rint;
return Infinity;
}

function measurand(st) {
var sc = SCENES[st.scene];
if (!sc) return { X: 0, note: '未接被测物' };
var red = st.probes.red, black = st.probes.black;
var gear = GEARS[st.gear];
if (!gear) return { X: 0, note: '挡位在 OFF' };

if (st.shorted) {
if (gear.fam === 'R') return { X: 0, note: '表笔短接：指针应指到 0 Ω' };
return { X: 0, note: '表笔短接' };
}
if (!red || !black) {
if (gear.fam === 'R') return { X: Infinity, note: '表笔悬空：欧姆挡外电路断开，指针应该停在最左端 ∞' };
return { X: 0, note: '表笔还没接到被测物上' };
}
if (red === black) {
if (gear.fam === 'R') return { X: 0, note: '两根表笔碰在同一个接线柱上，相当于短接' };
return { X: 0, note: '两根表笔接在同一个接线柱上' };
}

if (sc.kind === 'src') {
if (gear.fam === 'V') {
var pos = (red === 'bP' && black === 'bN');
var rev = (red === 'bN' && black === 'bP');
if (pos) return { X: sc.emf, note: '红笔接正极、黑笔接负极 —— 正确' };
if (rev) return { X: -sc.emf, note: '表笔接反了，指针会反向偏转' };
return { X: 0, note: '表笔没跨在电池两端' };
}
if (gear.fam === 'R') return { X: 5, note: '⚠ 用欧姆挡去测带电的电池：内外两个电池顺向串起来，指针会猛打' };
return { X: 0, note: '电流挡要串联，不能直接并在电池两端' };
}

if (sc.kind === 'res') {
if (gear.fam === 'R') return { X: sc.R, note: '欧姆挡测电阻' };
return { X: 0, note: '电阻本身没有电源，电压/电流挡不会有读数' };
}

if (sc.kind === 'diode') {
if (gear.fam === 'R') {
var R = (black === 'dA') ? sc.Rf : sc.Rr;
return {
X: R,
note: (black === 'dA')
? '黑表笔接正极：内部电池正向导通，电阻小'
: '红表笔接正极：内部电池反向，电阻很大'
};
}
return { X: 0, note: '二极管要用欧姆挡测正反向电阻' };
}

if (sc.kind === 'loop') {
var acrossBreak = (red === 'lA' && black === 'lB') || (red === 'lB' && black === 'lA');
if (gear.fam === 'I') {
if (!acrossBreak) return { X: 0, note: '电流表要串进断口 a、b 之间' };
var I = sc.emf / (sc.Rload + sc.rint);
if (red === 'lA') return { X: I, note: '串联正确：电流从红表笔流入' };
return { X: -I, note: '红黑表笔接反，指针反向偏转' };
}
if (gear.fam === 'V') {
if (!acrossBreak) return { X: 0, note: '没接在断口上' };
return { X: 0, note: '断口被电压表跨接，回路几乎不通（灯不亮）' };
}
return { X: sc.Rload + sc.rint, note: '欧姆挡测的是断口两端的电阻' };
}
return { X: 0, note: '' };
}

function hazard(st, meas) {

},
hint: '欧姆挡不分正负，两笔接电阻的两端就行。读数 = 刻度值 × 倍率。',
pass: '指针落在刻度 12 附近，12 × 100 = 1200 Ω = 1.2 kΩ。'
},
{
id: 6, title: '换 ×10 挡 · 必须重调零',
target: '切到 ×10 挡，先短接重新调零，再测同一个电阻',
setup: { gear: 'Rx10', scene: 'resistor' },
check: function (c) {
if (c.st.gear !== 'Rx10' || c.st.shorted) return false;
var a = c.st.probes.red, b = c.st.probes.black;
if (!((a === 'rA' && b === 'rB') || (a === 'rB' && b === 'rA'))) return false;
return Math.abs(c.st.kOhm - 1) <= 0.008 && isFinite(c.read.val) && Math.abs(c.read.val - 1200) / 1200 < 0.06;
},
hint: '换挡之后内部电路变了，调零可能跑掉。先短接看指针还在不在 0 Ω，不在就重调。',
pass: '同一只电阻，×100 挡指针在 12 附近，×10 挡指针跑到 120 附近 —— 指针位置不同，但乘上倍率结果一样。'
},
{
id: 7, title: '测二极管 · 黑笔接哪一端',
target: '切 ×10 挡并调零，用欧姆挡判断二极管的极性：黑表笔接正极时电阻小',
setup: { gear: 'Rx10', scene: 'diode' },
check: function (c) {
if (c.st.gear !== 'Rx10' || c.st.scene !== 'diode') return false;
var a = c.st.probes.red, b = c.st.probes.black;
return ((a === 'dB' && b === 'dA') || (a === 'dA' && b === 'dB')) &&
isFinite(c.read.val) && c.read.val < 2000 && Math.abs(c.st.kOhm - 1) <= 0.008;
},
hint: '欧姆挡的红表笔接内部电池的负极，黑表笔接正极 —— 所以黑笔接到二极管正极时，二极管才正向导通。',
pass: '黑笔接正极 → 正向导通，电阻只有几百欧；红笔接正极 → 反向，电阻接近无穷大。两根笔反过来再试一次，差别非常明显。'
},
{
id: 8, title: '测电流 · 串联进电路',
target: '切到直流电流 100 mA，把红笔接 a、黑笔接 b，把电流表串进断口，读出小灯泡的电流',
setup: { gear: 'mA100', scene: 'loop' },
check: function (c) {
return c.st.gear === 'mA100' && c.st.scene === 'loop' &&
c.st.probes.red === 'lA' && c.st.probes.black === 'lB';
},
hint: '电流表必须串在电路里。红笔接电流流进的那一端（a），黑笔接流出的那一端（b）。',
pass: '3 V 电源、39 Ω 灯泡，电流约 76 mA。电流表内阻很小，串进去几乎不影响电路 —— 这就是「电流表内阻要小」的原因。'
}
];
})(window.MM6);
</script>
<script>
window.MM6 = window.MM6 || {};
(function (NS) {
'use strict';
var P = NS.PHY;

var S = {
gear: 'OFF',
offGrid: 2.4,
kOhm: 1.12,
scene: 'battery',
probes: { red: null, black: null },
pos: { red: { x: 96, y: 220 }, black: { x: 304, y: 220 } },
shorted: false
};

var taskIdx = 0, freeMode = false, solved = false, quizMode = false;

var el = {};

function $(id) { return document.getElementById(id); }
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

function ctx() {
var meas = P.measurand(S);
var pRaw = P.rawPos(S.gear, meas.X, { kOhm: S.kOhm, offGrid: S.offGrid });
var pShow = P.clampPos(pRaw);
var read = P.reading(S.gear, pShow);
return { st: S, meas: meas, pRaw: pRaw, pShow: pShow, read: read, status: P.status(S.gear, pRaw) };
}

var lastDialGear = '__init__';
function render() {
var c = ctx();
if (lastDialGear !== S.gear) {
NS.DIAL.render($('dialBox'), S.gear);
lastDialGear = S.gear;
}
NS.DIAL.setNeedle(c.pShow);
NS.BENCH.setGear(S.gear);
NS.CIRCUIT.render(S.gear);
updateReadout(c);
updateTask(c);
updateHazard(c);
}

function updateReadout(c) {
var bigEl = $('readBig'), subEl = $('readSub'), tagEl = $('readTag');
if (!bigEl) return;
var g = P.GEARS[S.gear];
if (!g) {
bigEl.textContent = '—';
bigEl.className = 'read-big off';
subEl.textContent = '旋钮在 OFF：表头没有接入任何电路';
tagEl.textContent = 'OFF'; tagEl.className = 'tag tag-off';
return;
}
if (c.status === 'over') {
bigEl.textContent = '超量程';
bigEl.className = 'read-big over';
subEl.textContent = '指针已经打到右端挡针 —— 换一个更大的量程';
tagEl.textContent = '打表'; tagEl.className = 'tag tag-over';
setNote(c); return;
}
if (c.status === 'reverse') {
bigEl.textContent = '反偏';
bigEl.className = 'read-big over';
subEl.textContent = '指针往左端打 —— 红黑表笔接反了，或者电流方向反了';
tagEl.textContent = '接反'; tagEl.className = 'tag tag-over';
setNote(c); return;
}
if (g.fam === 'R') {
if (c.read.val === Infinity || !isFinite(c.read.val)) {
bigEl.textContent = '∞';
bigEl.className = 'read-big';
subEl.textContent = '指针停在最左端，电阻超出这一挡能读的范围';
} else {
bigEl.textContent = P.fmtOhm(c.read.val);
bigEl.className = 'read-big';
subEl.textContent = '刻度 ' + (c.read.dial < 10 ? c.read.dial.toFixed(2) : c.read.dial.toFixed(1)) +
' × ' + g.mult + ' = ' + P.fmtOhm(c.read.val) + '　（满量程 ' + g.label + '）';
}
tagEl.textContent = '欧姆挡'; tagEl.className = 'tag tag-ohm';
setNote(c);
return;
}
var v = c.read.val;
var txt = g.fam === 'V'
? (g.range <= 2.5 ? v.toFixed(2) : (g.range <= 50 ? v.toFixed(2) : v.toFixed(1))) + ' V'
: (v * 1000).toFixed(g.range <= 1e-3 ? 2 : 1) + ' mA';
bigEl.textContent = txt;
bigEl.className = 'read-big';
var coef = (g.range / P.DIAL_FULL);
var fullTxt = g.fam === 'I' ? (g.range * 1000).toFixed(0) + ' mA' : g.range + ' V';
var stepTxt = g.fam === 'I' ? (g.range * 1000 / 50).toFixed(2) + ' mA' : (g.range / 50).toFixed(2) + ' V';
subEl.textContent = '刻度 ' + c.read.dial.toFixed(1) + ' × ' + (coef < 0.01 ? coef.toFixed(4) : (coef < 0.1 ? coef.toFixed(3) : coef.toFixed(2))) +
' = ' + txt + '　（满量程 ' + fullTxt + '，一小格 ' + stepTxt + '）';
tagEl.textContent = g.fam === 'V' ? '直流电压' : '直流电流';
tagEl.className = 'tag ' + (g.fam === 'V' ? 'tag-v' : 'tag-mA');
setNote(c);
}

function setNote(c) {
var n = $('readNote');
if (!n) return;
var warn = false, txt = c.meas.note || '';
var unconnected = (!c.st.probes.red || !c.st.probes.black) && !c.st.shorted;
var isOhm = c.st.gear && P.GEARS[c.st.gear] && P.GEARS[c.st.gear].fam === 'R';
if (!unconnected && !c.st.shorted && isOhm && c.read && isFinite(c.read.dial) && c.read.dial > 150) {
txt = '指针太靠左了 —— 这个倍率读不准，换大一点的倍率（×100 或 ×1k）';
warn = true;
}
if (unconnected && !txt) txt = '表笔还没接到被测物上';
n.textContent = txt;
n.className = 'read-note' + (warn ? ' warn' : '');
}

function updateTask(c) {
if (freeMode) {
$('taskKicker').textContent = '自由练习';
$('taskTitle').textContent = '随便拧、随便接';
$('taskTarget').textContent = '换挡看表盘和内部电路怎么变；把表笔拖到接线柱上读数。想按流程练，点右上角「回到任务」。';
$('taskHint').textContent = '';
$('taskBtn').style.display = 'none';
$('taskSteps').innerHTML = '';
return;
}
var t = NS.TASKS[taskIdx];
if (!t) return;
$('taskKicker').textContent = '第 ' + (taskIdx + 1) + ' / ' + NS.TASKS.length + ' 关';
$('taskTitle').textContent = t.title;
$('taskTarget').textContent = t.target;

var ok = false;
try { ok = !!t.check(c); } catch (e) { ok = false; }
solved = ok;

var steps = [];
steps.push(doneRow('机械零位已调好', Math.abs(S.offGrid) <= 0.25));
if (t.id >= 2) steps.push(doneRow('挡位：' + (P.GEARS[S.gear] ? P.GEARS[S.gear].short : 'OFF'),
!!(P.GEARS[S.gear] && t.setup && P.GEARS[S.gear].fam === P.GEARS[t.setup.gear].fam && S.gear === t.setup.gear)));
if (t.id >= 2) {
if (t.id === 4) steps.push(doneRow('两根表笔已经短接', !!S.shorted));
else steps.push(doneRow('表笔已接到接线柱', !!(S.probes.red && S.probes.black)));
}
if (t.id >= 4) steps.push(doneRow('欧姆挡已调零', Math.abs(S.kOhm - 1) <= 0.008));
$('taskSteps').innerHTML = steps.join('');

var btn = $('taskBtn');
btn.style.display = 'block';
if (ok) {
btn.textContent = (taskIdx + 1 < NS.TASKS.length) ? '✓ 通过 · 下一关 →' : '✓ 全部完成 · 再练一遍';
btn.className = 'btn btn-ok';
$('taskHint').innerHTML = '<b>✓ 这一关过了。</b>' + t.pass;
} else {
btn.textContent = '还没完成';
btn.className = 'btn btn-wait';
$('taskHint').textContent = t.hint;
}
}

function doneRow(text, ok) {
return '<div class="step-row ' + (ok ? 'on' : '') + '"><span class="dot">' + (ok ? '✓' : '○') + '</span>' + text + '</div>';
}

function updateHazard(c) {
var h = P.hazard(S, c.meas);
var box = $('hazardBox');
if (h) { box.style.display = 'block'; box.textContent = h; }
else { box.style.display = 'none'; }
}

function pickGear(id) {
S.gear = id;
render();
}

function setScene(id) {
if (id === S.scene) return;
S.scene = id;
S.probes.red = null; S.probes.black = null;
S.pos.red = { x: 96, y: 220 }; S.pos.black = { x: 304, y: 220 };
S.shorted = false;
mountBench();
render();
}

function mountBench() {
NS.BENCH.mountProbe($('benchBox'), S.scene, S.pos,
function (which, x, y) { },
function (which) { snapProbe(which); });
}

function snapProbe(which) {
var art = NS.BENCH.SCENE_ART[S.scene];
var best = null, bd = 48;
for (var pid in art.posts) {
var q = art.posts[pid];
var d = Math.sqrt(Math.pow(S.pos[which].x - q[0], 2) + Math.pow(S.pos[which].y - q[1], 2));
if (d < bd) { bd = d; best = pid; }
}
if (best) {
var q2 = art.posts[best];
S.pos[which].x = q2[0]; S.pos[which].y = q2[1];
NS.BENCH.setProbePos(which, q2[0], q2[1]);
S.probes[which] = best;
} else {
S.probes[which] = null;
}
var dx = S.pos.red.x - S.pos.black.x, dy = S.pos.red.y - S.pos.black.y;
S.shorted = (Math.sqrt(dx * dx + dy * dy) < 34);
render();
}

function setMech(v01) {

S.offGrid = -3 + 6 * v01;
NS.BENCH.setZeroKnobs(v01, (S.kOhm - 0.85) / 0.35);
render();
}
function setOhm(v01) {
S.kOhm = 0.85 + 0.35 * v01;
NS.BENCH.setZeroKnobs((S.offGrid + 3) / 6, v01);
render();
}
function zeroCb() {
return {
getMech: function () { return (S.offGrid + 3) / 6; },
setMech: setMech,
getOhm: function () { return (S.kOhm - 0.85) / 0.35; },
setOhm: setOhm
};
}

function applyTask() {
var t = NS.TASKS[taskIdx];
if (!t) return;
if (t.setup) {
if (t.setup.gear) S.gear = t.setup.gear;
if (t.setup.scene) {
S.scene = t.setup.scene;
S.probes.red = null; S.probes.black = null;
S.pos.red = { x: 96, y: 220 }; S.pos.black = { x: 304, y: 220 };
S.shorted = false;
mountBench();
}
}
if (t.id === 1) { S.offGrid = 2.4; }
if (t.id === 4) { S.kOhm = 1.12; }
if (t.id === 6) { S.kOhm = 1.07; }
if (t.id === 7) { S.kOhm = 1.05; }
if (t.id === 8) { S.kOhm = 1.0; }
NS.BENCH.setZeroKnobs((S.offGrid + 3) / 6, (S.kOhm - 0.85) / 0.35);
$('progText').textContent = (taskIdx + 1) + ' / ' + NS.TASKS.length;
$('progBar').style.width = ((taskIdx + 1) / NS.TASKS.length * 100) + '%';
render();
}

function nextTask() {
if (!solved) { return; }
if (taskIdx + 1 < NS.TASKS.length) taskIdx++;
else taskIdx = 0;
applyTask();
}

function resetAll() {
taskIdx = 0; freeMode = false;
S.gear = 'OFF'; S.offGrid = 2.4; S.kOhm = 1.12;
S.scene = 'battery';
S.probes.red = null; S.probes.black = null;
S.pos.red = { x: 96, y: 220 }; S.pos.black = { x: 304, y: 220 };
S.shorted = false;
mountBench();
applyTask();
}

function startQuiz() {
var c = ctx();
if (!P.GEARS[S.gear] || c.status !== 'ok') return;
quizMode = true;
var ans = (c.read.fam === 'R') ? c.read.val : c.read.val * (c.read.fam === 'I' ? 1000 : 1);
var unit = c.read.fam === 'R' ? 'Ω' : (c.read.fam === 'I' ? 'mA' : 'V');
$('readBig').textContent = '? ? ?';
$('readBig').className = 'read-big quiz';
$('readSub').innerHTML = '<span style="color:#546e7a">照着表盘读，填到下面：</span>' +
'<input id="quizInput" class="quiz-input" type="text" placeholder="例如 1.20" autocomplete="off">' +
'<span class="quiz-unit">' + unit + '</span>' +
'<button class="btn btn-mini" id="quizSubmit">对答案</button>';
$('quizInput').focus();
$('quizSubmit').onclick = function () {
var v = parseFloat(($('quizInput').value || '').replace(/[^\d.\-]/g, ''));
if (isNaN(v)) { $('readSub').innerHTML = '<span style="color:#c0392b">先填一个数</span>'; return; }
var err = Math.abs(v - ans) / Math.abs(ans || 1);
quizMode = false;
if (err <= 0.06) {
$('readSub').innerHTML = '<span style="color:#27ae60;font-weight:700">✓ 读对了：' + (c.read.fam === 'R' ? P.fmtOhm(ans) : ans.toFixed(2) + ' ' + unit) + '</span>';
} else {
$('readSub').innerHTML = '<span style="color:#c0392b;font-weight:700">✗ 差一点：' + (c.read.fam === 'R' ? P.fmtOhm(ans) : ans.toFixed(2) + ' ' + unit) +
'（你填 ' + v + '）</span>';
}
setTimeout(function () { render(); }, 1800);
};
}

function init() {
NS.CIRCUIT.mount($('cirBox'));
NS.BENCH.mountGear($('gearBox'), pickGear);
NS.BENCH.mountZero($('zeroBox'), zeroCb());
mountBench();

document.querySelectorAll('.scene-tab').forEach(function (b) {
b.addEventListener('click', function () { setScene(b.getAttribute('data-scene')); markScene(); });
});
$('taskBtn').addEventListener('click', nextTask);
$('btnReset').addEventListener('click', resetAll);
$('btnFree').addEventListener('click', function () {
freeMode = !freeMode;
$('btnFree').textContent = freeMode ? '回到任务' : '自由练习';
render();
});
$('btnQuiz').addEventListener('click', startQuiz);
$('btnTest').addEventListener('click', function () {
var r = P.runSelfTest();
alert('物理自检：' + (r.pass ? '全部通过' : r.fail + ' 项失败') + '\n用例 ' + r.total + ' 条');
});
$('btnFull').addEventListener('click', function () {
var d = document.documentElement;
if (!document.fullscreenElement) {
if (d.requestFullscreen) d.requestFullscreen();
} else if (document.exitFullscreen) document.exitFullscreen();
});

document.addEventListener('keydown', function (e) {
var order = P.GEAR_ORDER;
var i = order.indexOf(S.gear);
if (e.key === 'ArrowRight') {
i = (i < 0) ? 0 : Math.min(order.length - 1, i + 1);
pickGear(order[i]); e.preventDefault();
} else if (e.key === 'ArrowLeft') {
i = (i < 0) ? 0 : Math.max(0, i - 1);
pickGear(order[i]); e.preventDefault();
} else if (e.key >= '1' && e.key <= '8') {
freeMode = false;
taskIdx = parseInt(e.key, 10) - 1;
$('btnFree').textContent = '自由练习';
applyTask(); e.preventDefault();
}
});

NS.BENCH.setZeroKnobs((S.offGrid + 3) / 6, (S.kOhm - 0.85) / 0.35);
NS.BENCH.rebindZero($('zeroBox'), zeroCb());
markScene();
applyTask();

setTimeout(function () {
var db = $('dialBox');
if (db && db.scrollWidth > db.clientWidth + 4) {
db.scrollLeft = (db.scrollWidth - db.clientWidth) / 2;
}
}, 420);
window.__mm6 = { state: S, ctx: ctx, render: render, selftest: P.runSelfTest, setTask: function (i) { taskIdx = i; applyTask(); } };
window.__viz = { selfTest: function () { return P.runSelfTest(); } };
}

function markScene() {
document.querySelectorAll('.scene-tab').forEach(function (b) {
b.classList.toggle('on', b.getAttribute('data-scene') === S.scene);
});
}

document.addEventListener('DOMContentLoaded', init);
})(window.MM6);
</script>
</body>
</html>
